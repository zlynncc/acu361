sversus abdominis. ","opEn":"Insert obliquely or transversely 0.5-0.8 cun posteriorly. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the lung."},"KI1":{"en":"Gushing Spring","locEn":"On the sole of the foot, in the deepest depression of the sole when the foot is in plantar flexion and the toes are curled.","actsEn":"Headache, dizziness, insomnia, sore and swollen throat, loss of voice, difficult urination.","specEn":"Jing-Well point (Wood)","anat":"皮肤→皮下组织（致密角质层与脂肪垫）→跖腱膜→趾长屈肌腱、蚓状肌。浅层有足底内侧神经皮支；深层为第2、3跖底动脉。","anatEn":"Skin → subcutaneous tissue (dense keratinized pad) → plantar aponeurosis → tendons of flexor digitorum longus and lumbricals. Superficially the medial plantar nerve; deeply the 2nd–3rd plantar metatarsal arteries.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"A key point for guiding fire back to its origin; moxibustion or medicinal plasters on Yongquan are often used for \"heat above, cold below\"."},"KI2":{"en":"Blazing Valley","locEn":"On the medial side of the foot, below the tuberosity of the navicular bone, at the border of the red and white flesh.","actsEn":"Irregular menstruation, uterine prolapse, nocturnal emission, wasting-thirst disorder (diabetes-like), diarrhea, sore and swollen throat.","specEn":"Ying-Spring point (Fire)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：足底内侧神经、隐神经；血管：足底内侧动脉、跖内侧静脉网。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"KI3":{"en":"Great Ravine","locEn":"In the malleolar region, in the depression between the tip of the medial malleolus and the Achilles tendon.","actsEn":"Headache, sore and swollen throat, toothache, tinnitus, insomnia, nocturnal emission, impotence, irregular menstruation, wasting-thirst disorder (diabetes-like).","specEn":"Shu-Stream point; Yuan-Source point","anat":"皮肤→皮下组织→内踝与跟腱之间→胫骨后肌腱后缘。浅层有隐神经分支；深层为胫神经、胫后动静脉。为踝管上口附近，刺激常引出足底放射感。","anatEn":"Skin → subcutaneous tissue → between the medial malleolus and the Achilles tendon → posterior to the tendon of tibialis posterior. Superficially branches of the saphenous nerve; deeply the tibial nerve and posterior tibial vessels. Near the proximal tarsal tunnel — stimulation often radiates to the sole.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"A key point for tonifying the kidney."},"KI4":{"en":"Great Bell","locEn":"In the malleolar region, the medial malleolusposteroinferior, in the depression on the upper border of the calcaneus, anterior to the attachment of the Achilles tendon.","actsEn":"Retention of urine, enuresis, constipation, hemoptysis, wheezing and dyspnea, heel pain.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：足底内侧神经、隐神经；血管：足底内侧动脉、跖内侧静脉网。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"KI6":{"en":"Shining Sea","locEn":"In the malleolar region, 1 cun below the tip of the medial malleolus, the lower border of the medial malleolus in the depression.","actsEn":"Dry and painful throat, red, swollen and painful eyes, insomnia, epilepsy, irregular menstruation, difficult urination.","specEn":"Confluent point (opening to the Yin Qiao Vessel)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：足底内侧神经、隐神经；血管：足底内侧动脉、跖内侧静脉网。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Combined with Lieque (LU7) for disorders of the throat and chest."},"KI7":{"en":"Returning Flow","locEn":"On the medial side of the lower leg, 2 cun above the tip of the medial malleolus, on the anterior border of the Achilles tendon.","actsEn":"Edema, abdominal distension, diarrhea, night sweats, absence of sweating, stiffness and pain of the lumbar spine.","specEn":"Jing-River point (Metal)","anat":"皮肤→皮下组织→跟腱前缘与胫骨后缘之间→趾长屈肌与拇长屈肌之间。浅层有隐神经；深层为胫神经、胫后动静脉。","anatEn":"Skin → subcutaneous tissue → between the anterior border of the Achilles tendon and the posterior tibial border → between flexor digitorum longus and flexor hallucis longus. Superficially the saphenous nerve; deeply the tibial nerve and posterior tibial vessels.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"A key point for sweating disorders."},"KI10":{"en":"Yin Valley","locEn":"In the posterior knee region, on the popliteal crease, on the lateral border of the tendon of m. semitendinosus.","actsEn":"Impotence, hernia, uterine bleeding, difficult urination.","specEn":"He-Sea point (Water)","anat":"皮肤→皮下组织→膝关节周围肌腱与关节囊。神经血管：隐神经、胫神经（L3~S1）；血管：大隐静脉、胫后动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and joint capsule around the knee. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":""},"KI16":{"en":"Huang Organ","locEn":"On the abdomen, 0.5 cun lateral to the umbilicus.","actsEn":"Abdominal pain, abdominal distension, vomiting, constipation, diarrhea.","specEn":"The Penetrating Vessel (Chong), Foot Shaoyin crossing (meeting) point","anat":"皮肤→皮下组织→腹直肌鞘与腹直肌（或腹外斜肌、腹内斜肌、腹横肌）→腹横筋膜→腹膜。神经血管：第11胸神经前支至腰神经前支；血管：腹壁下动静脉、腹壁浅静脉。","anatEn":"Skin → subcutaneous tissue → rectus sheath and rectus abdominis (or obliquus externus/internus/transversus abdominis) → transversalis fascia → peritoneum. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":""},"KI27":{"en":"House of Connecting","locEn":"On the chest, below the lower border of the clavicle, 2 cun lateral to the anterior midline.","actsEn":"Cough, wheezing and dyspnea, chest pain, vomiting.","specEn":"Foot Shaoyin Jing-River point (non-special point)","anat":"皮肤→皮下组织→胸大肌（或胸小肌）→肋间外肌、肋间内肌。","anatEn":"Skin → subcutaneous tissue → pectoralis major (or minor) → external and internal intercostal muscles. ","opEn":"Insert obliquely or transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the apex of the lung."},"LR1":{"en":"Great Rushing","locEn":"On the toe, the great toe on the lateral side of the distal phalanx, 0.1 cun posterior-lateral to the corner of the toenail root.","actsEn":"Hernia, enuresis, retention of urine, amenorrhea, uterine bleeding, epilepsy.","specEn":"Jing-Well point (Wood)","anat":"皮肤→皮下组织→趾骨骨膜。神经血管：腓深神经（L4~S1）；血管：足背动静脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx. ","opEn":"Insert superficially 0.1-0.2 cun, or prick with a fine needle to bleed. Moxibustion is applicable.","noteEn":""},"LR2":{"en":"Moving Between","locEn":"On the dorsum of the foot, between the 1st and 2nd toes, proximal to the web margin of the toes at the border of the red and white flesh.","actsEn":"Headache, red, swollen and painful eyes, optic atrophy, hypochondriac pain, hernia, dysmenorrhea, epilepsy, insomnia.","specEn":"Ying-Spring point (Fire)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：腓深神经（L4~S1）；血管：足背动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Commonly used for clearing liver fire."},"LR3":{"en":"Great Rushing","locEn":"On the dorsum of the foot, between the 1st and 2nd metatarsal bones, in the depression anterior to the bases of the metatarsal bones.","actsEn":"Headache, dizziness, red, swollen and painful eyes, hypochondriac pain, hernia, irregular menstruation, dysmenorrhea, epilepsy, insomnia, hypertension.","specEn":"Shu-Stream point; Yuan-Source point","anat":"皮肤→皮下组织→拇长伸肌腱与趾长伸肌腱之间→第1、2跖骨间骨间背侧肌。浅层有腓深神经皮支、足背静脉网；深层为腓深神经干与第1跖背动脉。","anatEn":"Skin → subcutaneous tissue → between the tendons of extensor hallucis and extensor digitorum longus → dorsal interosseous muscle between the 1st and 2nd metatarsals. Superficially the cutaneous branch of the deep peroneal nerve and dorsal venous network; deeply the deep peroneal nerve trunk and 1st dorsal metatarsal artery.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Known as the \"qi-dispersing point\", commonly used for soothing the liver and relieving depression; together with Hegu (LI4) it forms the \"Four Gates\"."},"LR4":{"en":"Canal Seal","locEn":"In the malleolar region, anterior to the medial malleolus, on the medial side of the tendon of m. tibialis anterior in the depression.","actsEn":"Hernia, nocturnal emission, difficult urination, abdominal pain.","specEn":"Jing-River point (Metal)","anat":"皮肤→皮下组织→踝关节支持带与肌腱之间。神经血管：股神经前皮支、隐神经（L2~4）、胫神经；血管：大隐静脉、股动静脉分支。","anatEn":"Skin → subcutaneous tissue → between the retinacula and tendons of the ankle. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"LR5":{"en":"Woodworm Canal","locEn":"On the medial side of the lower leg, 5 cun above the tip of the medial malleolus, at the middle of the medial surface of the tibia.","actsEn":"Irregular menstruation, leukorrhea, genital itching, difficult urination, hernia.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→小腿肌群。神经血管：股神经前皮支、隐神经（L2~4）、胫神经；血管：大隐静脉、股动静脉分支。","anatEn":"Skin → subcutaneous tissue → crural muscle groups. ","opEn":"Insert transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"LR8":{"en":"Spring at the Bend","locEn":"At the knee, the medial end of the popliteal crease, in the depression on the medial border of the tendon of m. semitendinosus.","actsEn":"Irregular menstruation, dysmenorrhea, leukorrhea, genital itching, nocturnal emission, impotence, knee pain.","specEn":"He-Sea point (Water)","anat":"皮肤→皮下组织→膝关节周围肌腱与关节囊。神经血管：股神经前皮支、隐神经（L2~4）、胫神经；血管：大隐静脉、股动静脉分支。","anatEn":"Skin → subcutaneous tissue → tendons and joint capsule around the knee. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":""},"LR13":{"en":"Completion Gate","locEn":"On the lateral side of the abdomen, below the free end of the 11th rib.","actsEn":"Abdominal distension, diarrhea, hypochondriac pain, jaundice.","specEn":"Front-Mu point of the Spleen; Meeting point of the zang organs; Foot Jueyin, Foot Shaoyang crossing (meeting) point","anat":"皮肤→皮下组织→腹外斜肌→腹内斜肌→腹横肌。浅层有第10、11胸神经前支外侧皮支；深层为第10、11肋间神经与肋间后血管。深层为肝脾投影区，肝脾肿大者禁深刺。","anatEn":"Skin → subcutaneous tissue → obliquus externus → obliquus internus → transversus abdominis. Superficially the lateral cutaneous branches of the 10th–11th thoracic nerves; deeply the 10th–11th intercostal nerves and vessels. Deeply overlies the liver/spleen projections — no deep needling with hepatosplenomegaly.","opEn":"Insert perpendicularly 0.8-1 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the liver and spleen."},"LR14":{"en":"Cycle Gate","locEn":"On the chest, the 6th intercostal space, 4 cun lateral to the anterior midline.","actsEn":"Vomiting, hiccups, mastitis, running piglet qi.","specEn":"Front-Mu point of the Liver; Foot Jueyin, Foot Taiyin, the Yin Linking Vessel (Yinwei) crossing (meeting) point","anat":"皮肤→皮下组织→腹外斜肌与肋间肌。浅层有第6肋间神经外侧皮支；深层为第6肋间神经、肋间后血管。右侧深部为胆囊与肝右叶，禁深刺。","anatEn":"Skin → subcutaneous tissue → obliquus externus abdominis and intercostal muscles. Superficially the lateral cutaneous branch of the 6th intercostal nerve; deeply the 6th intercostal nerve and vessels. On the right, the gallbladder and right hepatic lobe lie deep — deep needling contraindicated.","opEn":"Insert obliquely or transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the liver."},"GV1":{"en":"Long Strength","locEn":"In the perineal region, the coccyx below, at the midpoint of the line connecting the tip of the coccyx and the anus.","actsEn":"Diarrhea, dysentery, constipation, blood in the stool, rectal prolapse, manic-depressive psychosis.","specEn":"The Governing Vessel (Du) Luo-Connecting point; the Governing Vessel (Du), Foot Shaoyin, Foot Shaoyang crossing (meeting) point","anat":"皮肤→皮下组织→肛尾韧带。浅层有尾神经后支与肛门神经分支；深层为肛动静脉分支。侧卧屈髋位取穴。","anatEn":"Skin → subcutaneous tissue → anococcygeal ligament. Superficially the posterior ramus of the coccygeal nerve and branches of the anal nerve; deeply branches of the inferior rectal vessels. Needle with the patient in lateral recumbent, hips flexed.","opEn":"Obliquely insert 0.8-1.0 cun close to the anterior aspect of the coccyx. Moxibustion is applicable.","noteEn":"Perpendicular deep insertion is not advised, to avoid injuring the rectum."},"GV3":{"en":"Lumbar Yang Pass","locEn":"In the spinal region, below the spinous process of the 4th lumbar vertebra in the depression, on the posterior midline.","actsEn":"Weakness and paralysis of the lower limbs, irregular menstruation, nocturnal emission, impotence.","specEn":"The Governing Vessel (Du) Jing-River point (non-special point)","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第4腰神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of L4; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-1 cun upward. Moxibustion is applicable.","noteEn":"Approximately level with the iliac crest, a landmark for locating Yaoyangguan (GV3)."},"GV4":{"en":"Gate of Life","locEn":"In the spinal region, below the spinous process of the 2nd lumbar vertebra in the depression, on the posterior midline.","actsEn":"Lumbago, nocturnal emission, impotence, irregular menstruation, leukorrhea, diarrhea, edema.","specEn":"The Governing Vessel (Du) Jing-River point (non-special point); key point for warming yang","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第2腰神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of L2; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-1 cun upward. Moxibustion is applicable.","noteEn":"A commonly used moxibustion point for warming and tonifying kidney yang."},"GV9":{"en":"Reaching Yang","locEn":"In the spinal region, below the spinous process of the 7th thoracic vertebra in the depression, on the posterior midline.","actsEn":"Jaundice, angina pectoris, stomachache, spinal rigidity.","specEn":"The Governing Vessel (Du) Jing-River point (non-special point)","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第7胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T7; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-1 cun upward. Moxibustion is applicable.","noteEn":"Approximately level with the inferior angle of the scapula."},"GV14":{"en":"Great Vertebra","locEn":"In the spinal region, below the spinous process of the 7th cervical vertebra in the depression, on the posterior midline.","actsEn":"Malaria, common cold, cough, wheezing and dyspnea, stiff neck, shoulder and back pain, manic-depressive psychosis.","specEn":"The Governing Vessel (Du), Hand and FootThree Yang Meridians crossing (meeting) point","anat":"皮肤→皮下组织→棘上韧带→棘间韧带。浅层有腰神经后支皮支；深层为黄韧带与椎管。低头位时第7颈椎棘突最突出。","anatEn":"Skin → subcutaneous tissue → supraspinous ligament → interspinous ligament. Superficially the cutaneous branch of the posterior ramus of a cervical nerve; deeply the ligamentum flavum and spinal canal. C7 spinous process is most prominent with the neck flexed.","opEn":"Insert obliquely 0.5-1 cun upward. Moxibustion is applicable.","noteEn":"A key point for reducing fever."},"GV15":{"en":"Mute Gate","locEn":"In the posterior cervical region, the below the upper border of the 2nd cervical vertebra in the depression, on the posterior midline.","actsEn":"Sudden hoarseness/loss of voice, stiff tongue with aphasia, stiff neck, manic-depressive psychosis.","specEn":"The Governing Vessel (Du), the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→斜方肌与胸锁乳突肌之间的结缔组织。神经血管：相应脊神经后支；血管：肋间后动脉/腰动脉背侧支。","anatEn":"Skin → subcutaneous tissue → connective tissue between trapezius and sternocleidomastoid. ","opEn":"Insert slowly toward the mandible 0.5-1.0 cun.","noteEn":"The medulla oblongata lies deep — deep upward insertion and moxibustion are prohibited; insert slowly."},"GV16":{"en":"Wind Palace","locEn":"In the posterior cervical region, directly below the external occipital protuberance, in the depression between the two sides of m. trapezius.","actsEn":"Headache, stiff neck, dizziness, sore and swollen throat, stroke, manic-depressive psychosis.","specEn":"The Governing Vessel (Du), the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→斜方肌与胸锁乳突肌之间的结缔组织。神经血管：相应脊神经后支；血管：肋间后动脉/腰动脉背侧支。","anatEn":"Skin → subcutaneous tissue → connective tissue between trapezius and sternocleidomastoid. ","opEn":"Insert slowly toward the mandible 0.5-1.0 cun.","noteEn":"The medulla oblongata lies deep — deep upward insertion and moxibustion are prohibited."},"GV20":{"en":"Hundred Convergences","locEn":"On the head, 5 cun directly above the midpoint of the anterior hairline.","actsEn":"Headache, dizziness, stroke, manic-depressive psychosis, insomnia, poor memory, rectal prolapse, uterine prolapse.","specEn":"The Governing Vessel (Du), Foot Taiyang crossing (meeting) point","anat":"皮肤→皮下组织→帽状腱膜→腱膜下疏松组织。浅层有眶上神经与枕大神经吻合支、颞浅动静脉顶支；深层为颅骨外膜。此区血管网丰富，出针后须按压止血。","anatEn":"Skin → subcutaneous tissue → galea aponeurotica → subaponeurotic loose tissue. Superficially the communicating branches of the supraorbital and greater occipital nerves, parietal branches of the superficial temporal vessels; deeply the pericranium. Rich vascular network — apply pressure after needle withdrawal.","opEn":"Insert transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"A key point for raising yang and lifting prolapse; located at the midpoint of the line connecting the tips of the ears."},"GV24":{"en":"Spirit Courtyard","locEn":"On the head, 0.5 cun directly above the midpoint of the anterior hairline.","actsEn":"Headache, dizziness, insomnia, sinusitis, manic-depressive psychosis.","specEn":"The Governing Vessel (Du), Foot Taiyang, Foot Yangming crossing (meeting) point","anat":"皮肤→皮下组织→帽状腱膜及颅骨外膜。神经血管：三叉神经分支、枕大神经；血管：颞浅动脉、眶上动脉、枕动脉。","anatEn":"Skin → subcutaneous tissue → galea aponeurotica and pericranium. ","opEn":"Insert transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"GV25":{"en":"Plain Bone Crevice","locEn":"On the face, at the tip of the nose.","actsEn":"Coma, convulsions, nasal congestion, nosebleed, sinusitis.","specEn":"The Governing Vessel (Du) Jing-River point (non-special point)","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：三叉神经分支（眶下神经、上牙槽神经）；血管：面动脉分支、鼻中隔动脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert obliquely 0.3-0.5 cun upward, or prick with a fine needle to bleed.","noteEn":"Moxibustion is prohibited; commonly used in first aid to raise blood pressure."},"GV26":{"en":"Water Trough","locEn":"On the face, at the junction of the the upper 1/3 and the middle 1/3 of the philtrum.","actsEn":"Coma, syncope, heatstroke, manic-depressive psychosis, deviation of the mouth and eye, stiffness and pain of the lumbar spine.","specEn":"The Governing Vessel (Du), Hand Yangming crossing (meeting) point","anat":"皮肤→皮下组织→口轮匝肌。浅层有上唇动脉与眶下神经分支；深层为上唇方肌（提上唇鼻翼肌）起点。","anatEn":"Skin → subcutaneous tissue → orbicularis oris. Superficially the superior labial artery and branches of the infraorbital nerve; deeply the origin of levator labii superioris alaeque nasi.","opEn":"Insert obliquely 0.3-0.5 cun upward, or press firmly with the thumbnail.","noteEn":"A key first-aid point; often pressed firmly with the thumbnail."},"CV3":{"en":"Middle Pole","locEn":"In the lower abdomen, 4 cun below the center of the umbilicus, on the anterior midline.","actsEn":"Enuresis, difficult urination, retention of urine, nocturnal emission, impotence, irregular menstruation, dysmenorrhea, leukorrhea, infertility.","specEn":"Front-Mu point of the Bladder; the Conception Vessel (Ren), the three foot Yin Meridians crossing (meeting) point","anat":"皮肤→皮下组织→腹直肌鞘前壁→腹直肌→腹横筋膜。神经血管：相应胸神经前支（T6~L1）；血管：腹壁上/下动静脉。","anatEn":"Skin → subcutaneous tissue → anterior layer of rectus sheath → rectus abdominis → transversalis fascia. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Empty the bladder before needling; use with caution in pregnancy."},"CV4":{"en":"Pass Head","locEn":"In the lower abdomen, 3 cun below the center of the umbilicus, on the anterior midline.","actsEn":"Enuresis, nocturnal emission, impotence, irregular menstruation, dysmenorrhea, infertility, consumptive disease, diarrhea.","specEn":"Front-Mu point of the Small Intestine; the Conception Vessel (Ren), the three foot Yin Meridians crossing (meeting) point; major tonification point","anat":"皮肤→皮下组织→腹白线。浅层有第12肋间神经前皮支与腹壁浅静脉；深层为腹壁下动静脉。腹腔内为小肠，孕妇慎用。","anatEn":"Skin → subcutaneous tissue → linea alba. Superficially the anterior cutaneous branch of the 12th intercostal nerve and superficial epigastric vein; deeply the inferior epigastric vessels. Small intestine beneath; use cautiously in pregnancy.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Commonly used for health-preserving moxibustion; contraindicated in pregnancy; empty the bladder before needling."},"CV6":{"en":"Qi Sea","locEn":"In the lower abdomen, 1.5 cun below the center of the umbilicus, on the anterior midline.","actsEn":"Abdominal pain, diarrhea, constipation, enuresis, nocturnal emission, impotence, irregular menstruation, fatigue.","specEn":"Yuan-Source point of the Huang; major tonification point","anat":"皮肤→皮下组织→腹直肌鞘前壁→腹直肌→腹横筋膜。神经血管：相应胸神经前支（T6~L1）；血管：腹壁上/下动静脉。","anatEn":"Skin → subcutaneous tissue → anterior layer of rectus sheath → rectus abdominis → transversalis fascia. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"As the saying goes, \"one point, Qihai, warms the whole body\"."},"CV8":{"en":"Spirit Tower Gate","locEn":"On the umbilical region, at the center of the umbilicus.","actsEn":"Abdominal pain, abdominal distension, diarrhea, dysentery, rectal prolapse, edema.","specEn":"The Conception Vessel (Ren) Jing-River point (non-special point); contraindicated to needle","anat":"皮肤→皮下组织→腹直肌鞘与腹直肌（或腹外斜肌、腹内斜肌、腹横肌）→腹横筋膜→腹膜。神经血管：相应胸神经前支（T6~L1）；血管：腹壁上/下动静脉。","anatEn":"Skin → subcutaneous tissue → rectus sheath and rectus abdominis (or obliquus externus/internus/transversus abdominis) → transversalis fascia → peritoneum. ","opEn":"No needling; suitable for indirect moxibustion with salt or ginger.","noteEn":"Needling is prohibited, moxibustion only; moxibustion works well for deficiency-cold diarrhea."},"CV12":{"en":"Central Vulture","locEn":"In the upper abdomen, 4 cun above the center of the umbilicus, on the anterior midline.","actsEn":"Stomachache, abdominal distension, vomiting, acid regurgitation, diarrhea, jaundice, insomnia.","specEn":"Front-Mu point of the Stomach; Meeting point of the fu organs; the Conception Vessel (Ren), Hand Taiyang, Foot Yangming crossing (meeting) point","anat":"皮肤→皮下组织→腹白线/腹直肌鞘。浅层有第8肋间神经前皮支；深层为腹壁上动静脉。深部正对胃与肝左叶，肝大者禁深刺。","anatEn":"Skin → subcutaneous tissue → linea alba / rectus sheath. Superficially the anterior cutaneous branch of the 8th intercostal nerve; deeply the superior epigastric vessels. Stomach and left hepatic lobe directly beneath — deep needling contraindicated with hepatomegaly.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Meeting point of the fu organs (Zhongwan); a main point for spleen-stomach disorders."},"CV17":{"en":"Chest Center","locEn":"On the chest, level with the 4th intercostal space, on the anterior midline.","actsEn":"Cough, wheezing and dyspnea, chest pain, palpitations, insufficient lactation, mastitis.","specEn":"Front-Mu point of the Pericardium; Meeting point of qi; the Conception Vessel (Ren), Foot Taiyin, Foot Shaoyin, Hand Taiyang, Hand Shaoyang crossing (meeting) point","anat":"皮肤→皮下组织→胸骨体骨膜。浅层有第4肋间神经前皮支；深层为胸骨。此区浅刺即可得气。","anatEn":"Skin → subcutaneous tissue → periosteum of the sternal body. Superficially the anterior cutaneous branch of the 4th intercostal nerve; deeply the sternum itself. Deqi is obtained at a shallow level here.","opEn":"Insert transversely 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Meeting point of qi (Danzhong); a key point for easing the chest and regulating qi."},"CV22":{"en":"Heavenly Chimney","locEn":"In the anterior cervical region, at the center of the suprasternal fossa, on the anterior midline.","actsEn":"Cough, wheezing and dyspnea, sore and swollen throat, sudden hoarseness/loss of voice, goiter.","specEn":"The Conception Vessel (Ren), the Yin Linking Vessel (Yinwei) crossing (meeting) point","anat":"皮肤→皮下组织→胸骨上窝→气管前筋膜。浅层有颈横神经、颈前静脉；深层为气管、主动脉弓与大血管起始部。针尖须沿胸骨柄后缘斜刺，严禁直刺深刺。","anatEn":"Skin → subcutaneous tissue → suprasternal fossa → pretracheal fascia. Superficially the transverse cervical nerve and anterior jugular vein; deeply the trachea, aortic arch and great vessels. Needle must be obliquely inserted behind the manubrium — direct deep needling strictly prohibited.","opEn":"First insert perpendicularly 0.2 cun, then angle the tip downward and advance 0.5-1.0 cun close behind the sternum.","noteEn":"Do not insert deeply downward, to avoid injuring the trachea and blood vessels."},"CV23":{"en":"Ravine Spring","locEn":"In the anterior cervical region, the laryngeal prominenceabove, in the depression on the upper border of the hyoid bone.","actsEn":"Stiff tongue with aphasia, sudden hoarseness/loss of voice, sore and swollen throat, drooling.","specEn":"The Conception Vessel (Ren), the Yin Linking Vessel (Yinwei) crossing (meeting) point","anat":"皮肤→皮下组织→颈阔肌→胸锁乳突肌相关层次。神经血管：舌下神经及舌神经分支；血管：甲状腺上动脉、舌动脉分支。","anatEn":"Skin → subcutaneous tissue → platysma → layers related to the sternocleidomastoid. ","opEn":"Insert obliquely 0.5-0.8 cun toward the root of the tongue.","noteEn":""},"CV24":{"en":"Receiving Fluid","locEn":"On the face, in the central depression of the mentolabial groove.","actsEn":"Deviation of the mouth and eye, swollen and painful gums, drooling, sudden hoarseness/loss of voice, manic-depressive psychosis.","specEn":"The Conception Vessel (Ren), Foot Yangming crossing (meeting) point","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：下牙槽神经末支（颏神经）；血管：下唇动脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert obliquely 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"LU2":{"en":"Cloud Gate","locEn":"On the chest, the infraclavicular fossa in the depression, on the medial border of the coracoid process of the scapula, 6 cun lateral to the anterior midline.","actsEn":"Cough, wheezing and dyspnea, chest pain, shoulder and back pain.","specEn":"Hand Taiyin Jing-River point (non-special point)","anat":"皮肤→皮下组织→胸大肌（或胸小肌）→肋间外肌、肋间内肌。神经血管：臂外侧皮神经（C5~T1）、桡神经浅支；血管：头静脉、桡动静脉。","anatEn":"Skin → subcutaneous tissue → pectoralis major (or minor) → external and internal intercostal muscles. ","opEn":"Insert obliquely 0.5-0.8 cun laterally. Moxibustion is applicable.","noteEn":"Do not insert deeply inward, to avoid injuring the lung."},"LU3":{"en":"Palace of Heaven","locEn":"In the anterior brachial region, 3 cun below the end of the anterior axillary fold, on the radial border of m. biceps brachii.","actsEn":"Cough, wheezing and dyspnea, nosebleed, goiter.","specEn":"Hand Taiyin Jing-River point (non-special point)","anat":"皮肤→皮下组织→肱二头肌/肱三头肌。神经血管：臂外侧皮神经（C5~T1）、桡神经浅支；血管：头静脉、桡动静脉。","anatEn":"Skin → subcutaneous tissue → biceps brachii / triceps brachii. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":""},"LU4":{"en":"Guarding White","locEn":"In the anterior brachial region, 4 cun b  "SP": { zh: "足太阴脾经起于足大趾内侧端隐白，沿足内侧赤白肉际上行，经内踝前、下肢内侧前缘（三阴交处交会肝、肾二经），上膝股内侧前缘，入腹属脾络胃；上膈，夹咽两旁，连舌根，散于舌下；胃部支脉上膈，注心中，交手少阴心经。",

 "HT": { zh: "手少阴心经起于心中，出属心系，下络小肠；其支脉从心系上夹咽喉，连于目系；直行者从心系退回上行经过肺，横出腋下（极泉），沿上肢内侧后缘下行，过肘、腕入掌内后缘，止于小指桡侧端少冲，交手太阳小肠经。",

   en: "The Foot Shaoyang Gallbladder Meridian starts at Tongziliao (GB1) at the outer canthus, ascends to the corner of the forehead and behind the ear, along the side of the neck and over the shoulder into the supraclavicular fossa. It descends through the chest, crosses the diaphragm to connect with the liver and gallbladder, runs along the ribs to the hip region (Huantiao, GB30), then down the lateral thigh and leg, past the fibular head and anterior to the lateral malleolus, across the dorsum to Zuqiaoyin (GB44) on the lateral side of the 4th toe; a dorsal branch reaches the great toe, linking with the Foot Jueyin Liver Meridian." },

<script>
/* 穴位 · 十四经学习  —— 应用逻辑 */
(function () {
  'use strict';

  const POINTS = window.ACU_POINTS || [];
  const MERS = window.MERIDIANS || [];
  const merById = {};
  MERS.forEach(m => { merById[m.id] = m; });
  const byCode = {};
  POINTS.forEach(p => { byCode[p.c] = p; p.mer = merById[p.m]; });

  /* ---------------- 本地存储 ---------------- */
  const KEY = 'acu-study-v1';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
  const learned = new Set(saved.learned || []);
  const fav = new Set(saved.fav || []);
  let answered = Number(saved.answered) || 0;
  /* 错题本：{ 题目标识: {item, wrong, streak, ts} } */
  let wrongBook = saved.wrongBook || {};
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ learned: [...learned], fav: [...fav], answered, wrongBook, theme }));
    } catch (e) {}
  }

  /* ---------------- 主题（浅色 / 深色） ---------------- */
  let theme = saved.theme || '';   /* '' 跟随系统 | 'light' | 'dark' */
  function applyTheme() {
    const dark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#201d18' : '#f4efe4');
  }
  function setTheme(t) {
    theme = t;
    try { localStorage.setItem(KEY, JSON.stringify({ learned: [...learned], fav: [...fav], answered, wrongBook, theme })); } catch (e) {}
    applyTheme();
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!theme) applyTheme(); });

  /* 题目标识：用答案文本去重（同一知识点重复出错只记一次） */
  const qkey = it => (it.type || '') + '|' + (it.answer || '').slice(0, 60);
  function recordWrong(it, right) {
    const k = qkey(it);
    if (right) {
      /* 答对：若在错题本中，累计连对次数，连对 2 次移出 */
      const rec = wrongBook[k];
      if (rec) {
        rec.streak = (rec.streak || 0) + 1;
        if (rec.streak >= 2) delete wrongBook[k];
      }
    } else {
      const rec = wrongBook[k];
      if (rec) { rec.wrong = (rec.wrong || 1) + 1; rec.streak = 0; rec.ts = Date.now(); rec.item = it; }
      else { wrongBook[k] = { item: it, wrong: 1, streak: 0, ts: Date.now() }; }
    }
    persist();

  /* 从 spec 提取某类别的穴位 */
  function pointsOfCat(cat) {
    const out = [];
    const re = cat === '井穴' ? /(^|[；;、])井穴/ : new RegExp('(^|[；;、])' + cat);
    POINTS.forEach(p => {
      if (!p.spec) return;
      const parts = p.spec.split(/[；;]/);
      for (const x of parts) {
        const t = x.trim();
        let ok = false;
        if (cat === '井穴') ok = /井穴/.test(t);
        else if (cat === '荥穴') ok = /荥穴/.test(t) && !/下合/.test(t);
        else if (cat === '输穴') ok = /输穴/.test(t) && !/背俞/.test(t);
        else if (cat === '经穴') ok = !/交会|郄|络|募|背俞|原|八会|八脉|下合|井|荥|合|非特定|所起/.test(t) && /^[足手]?[太阴阳明少厥阳]{0,4}经穴\s*（[木火土金水相火]+）$/.test(t);
        else if (cat === '合穴') ok = /合穴/.test(t) && !/下合/.test(t) && !/井/.test(t);
        else if (cat === '原穴') ok = /原穴/.test(t) && !/背俞/.test(t);
        else if (cat === '络穴') ok = /络穴/.test(t) && !/脾之大络/.test(t) === false || /络穴/.test(t);
        else if (cat === '背俞穴') ok = /背俞穴/.test(t);
        else if (cat === '募穴') ok = /募穴/.test(t) && !/背俞/.test(t);
        else if (cat === '郄穴') ok = /郄穴/.test(t);
        else if (cat === '下合穴') ok = /下合穴/.test(t);
        else if (cat === '八会穴') ok = /八会穴/.test(t);
        else if (cat === '八脉交会穴') ok = /八脉交会穴/.test(t);
        if (ok) { out.push({ p, label: t }); break; }
      }
    });
    return out;
  }

    s = s.replace(/([肺大肠胃脾心小肠膀胱肾心包三焦胆肝]{1,3})(络穴)/g, (_, o) => `Luo point of the ${ORG[o] || o} meridian`);

    s = s.replace(/([肺大肠胃脾心小肠膀胱肾心包三焦胆肝]{1,3})之原穴/g, (_, o) => `Yuan-source point of the ${ORG[o] || o}`);
    s = s.replace(/膏之原穴/g, 'Yuan-source point of Gao').replace(/肓之原穴/g, 'Yuan-source point of Huang');
    s = s.replace(/督脉络穴/g, 'Luo point of the Du Mai').replace(/任脉络穴/g, 'Luo point of the Ren Mai').replace(/脾之大络/g, 'great luo of the Spleen');

    s = s.replace(/八脉交会穴（通(任脉|督脉|冲脉|带脉|阳跷脉|阴跷脉|阳维脉|阴维脉)）/g, (_, v) => 'Eight-confluent point (opens ' + ({'任脉':'Ren Mai','督脉':'Du Mai','冲脉':'Chong Mai','带脉':'Dai Mai','阳跷脉':'Yang qiao','阴跷脉':'Yin qiao','阳维脉':'Yang wei','阴维脉':'Yin wei'}[v]) + ')');
    s = s.replace(/(井|荥|输|经|合)穴（([木火土金水相火]{1,3})）/g, (_, t, e) => ({'井':'Jing-well','荥':'Ying-spring','输':'Shu-stream','经':'Jing-river','合':'He-sea'}[t]) + ' point (' + (EL[e] || e) + ')');
    s = s.replace(/(井|荥|输|经|合)穴/g, (_, t) => ({'井':'Jing-well','荥':'Ying-spring','输':'Shu-stream','经':'Jing-river','合':'He-sea'}[t]) + ' point');
    s = s.replace(/脾之大络/g, 'great luo of the Spleen');
    s = s.replace(/手足(太阴|阳明|少阴|太阳|厥阴|少阳)交会穴/g, 'Crossing point of the hand and foot $1 meridians');
    s = s.replace(/原穴/g, 'Yuan-source point').replace(/络穴/g, 'Luo point').replace(/郄穴/g, 'Xi-cleft point')
         .replace(/募穴/g, 'Front-mu point').replace(/背俞穴/g, 'Back-shu point').replace(/下合穴/g, 'Lower he-sea point')
         .replace(/八会穴/g, 'Eight-influential point').replace(/交会穴/g, 'Crossing point').replace(/经穴/g, 'Jing-river point');
    s = s.replace(/手足(太阴|阳明|少阴|太阳|厥阴|少阳)交会穴/g, 'Crossing point of the hand-foot yin-yang meridians');
    s = s.replace(/([木火土金水])(阴|阳)(维|跷)脉交会穴/g, 'Crossing point of the $2$3 vessel');
    s = s.replace(/([肺大肠胃脾心小肠膀胱肾心包三焦胆肝]{1,3})、阳(维|跷)脉交会穴/g, (_, o, v) => `Crossing point of the ${ORG[o] || o} meridian and the Yang ${v} vessel`);

    s = s.replace(/([肺大肠胃脾心小肠膀胱肾心包三焦胆肝]{1,3})([手太阴阳明少厥阳]*)经/g, (_, o) => `${ORG[o] || o} meridian`);
    s = s.replace(/四总穴之一/g, 'one of the Four Command Points');
    s = s.replace(/([肺大肠胃脾心小肠膀胱肾心包三焦胆肝]{1,3})经、([阴阳])(维|跷)脉交会穴/g, (_, o, y, w) => `Crossing point of the ${ORG[o] || o} meridian and the ${y === '阳' ? 'Yang' : 'Yin'} ${w} vessel`);
    s = s.replace(/(太阴|阳明|少阴|太阳|厥阴|少阳)/g, t => ({'太阴':'Taiyin','阳明':'Yangming','少阴':'Shaoyin','太阳':'Taiyang','厥阴':'Jueyin','少阳':'Shaoyang'}[t]));

    /* 收尾：手/足前缀、阴阳维跷脉、交会组合与全角括号 */
    s = s.replace(/手足阳明、阳跷脉交会穴/g, 'Crossing point of the hand and foot Yangming meridians and the Yang qiao vessel');
    s = s.replace(/手足太阳、足阳明、阴阳跷脉交会穴/g, 'Crossing point of the hand and foot Taiyang meridians, the Stomach meridian and the Yin-Yang qiao vessels');
    s = s.replace(/足三阴经交会穴/g, 'Crossing point of the three foot yin meridians');
    s = s.replace(/督脉、手足三阳交会穴/g, 'Crossing point of the Du Mai and the hand and foot three yang meridians');
    s = s.replace(/手足三阳/g, 'the hand and foot three yang meridians').replace(/足三阴/g, 'the three foot yin meridians')

         .replace(/阴阳跷脉/g, 'the Yin and Yang qiao vessels');
    s = s.replace(/手(?=[A-Z、])/g, 'Hand ').replace(/足(?=[A-Z、])/g, 'Foot ');
    s = s.replace(/([阴阳])([维跷])脉/g, (_, y, w) => (y === '阳' ? 'Yang ' : 'Yin ') + (w === '维' ? 'wei' : 'qiao') + ' vessel');
    s = s.replace(/督脉/g, 'Du Mai ').replace(/任脉/g, 'Ren Mai ').replace(/冲脉/g, 'Chong Mai ').replace(/带脉/g, 'Dai Mai ');
    s = s.replace(/(Mai|vessel)(?=[A-Z])/g, '$1 ');
    /* 交会穴兜底（按分句处理）：将剩余「A、B、CCrossing point」逐词翻译组合 */
    if (/Crossing point/.test(s) && /[\u4e00-\u9fff]/.test(s)) {
      const TOK = { '督脉':'Du Mai','任脉':'Ren Mai','冲脉':'Chong Mai','带脉':'Dai Mai',
        '足阳明':'Stomach meridian','手阳明':'Large Intestine meridian','足太阳':'Bladder meridian','手太阳':'Small Intestine meridian',

        '足少阴':'Kidney meridian','手少阴':'Heart meridian','足厥阴':'Liver meridian','手厥阴':'Pericardium meridian',
        '阳跷':'Yang qiao vessel','阴跷':'Yin qiao vessel','阳维':'Yang wei vessel','阴维':'Yin wei vessel',
        '足三阴':'the three foot yin meridians','手足三阳':'the hand and foot three yang meridians',
        'Foot 三阴':'the three foot yin meridians','手Foot Shaoyang':'the hand and foot Shaoyang meridians' };
      s = s.split('；').map(cl => {
        if (!(/Crossing point/.test(cl) && /[\u4e00-\u9fff]/.test(cl))) return cl;
        const parts = cl.replace(/Crossing point/g, '').split(/[、，]/).map(t => t.trim()).filter(Boolean);
        const en = parts.map(t => TOK[t] || t);
        return 'Crossing point of the ' + en.join(', and the ');
      }).join('; ');
    }
    s = s.replace(/([A-Za-z ]+)、(Yang|Yin) (wei|qiao) vesselCrossing point/g, 'Crossing point of the $1 meridian and the $2 $3 vessel');
    s = s.replace(/([A-Za-z ]+)、([A-Za-z ]+)Crossing point/g, 'Crossing point of the $1 and $2 meridians');
    s = s.replace(/([A-Za-z ]+)、阳跷脉交会穴/g, 'Crossing point of the $1 and Yang qiao vessel');
    s = s.replace(/（/g, ' (').replace(/）/g, ')').replace(/ \(/g, ' (').replace(/；/g, '; ');
    s = s.replace(/\(\(/g, '(').replace(/\)\)/g, ')');
    return s.trim();
  }

  /* ---------------- 搜索 ---------------- */
  function matchPoints(q) {
    const raw = q.trim();
    if (!raw) return [];
    const low = raw.toLowerCase();
    const plain = stripTone(raw).replace(/\s+/g, '');
    return POINTS.filter(p => {
      if (p.n.includes(raw)) return true;
      if (p.c.toLowerCase().includes(low)) return true;
      if (stripTone(p.py).replace(/\s+/g, '').includes(plain)) return true;
      if (p.acts.includes(raw)) return true;
      if ((p.spec || '').includes(raw)) return true;
      if (p.loc.includes(raw)) return true;
      const ep = window.AC_EN && window.AC_EN.P[p.c];
      if (ep) {
        if ((ep.en || '').toLowerCase().includes(low)) return true;
        if ((ep.actsEn || '').toLowerCase().includes(low)) return true;
        if ((ep.locEn || '').toLowerCase().includes(low)) return true;
      }
      if (p.mer && (p.mer.name.includes(raw) || p.mer.short.includes(raw))) return true;
      return false;
    });
  }

        <div class="point-list">

                <div style="font-size:10.5px;color:var(--ink3);font-style:italic;margin-top:1px">${((window.AC_EN.P[p.c] || {}).en) || ''} — ${((window.AC_EN.P[p.c] || {}).locEn || '').slice(0, 60)}${(((window.AC_EN.P[p.c] || {}).locEn || '').length > 60) ? '…' : ''}</div>

  /* ---------------- 考核 ---------------- */
  /* 全部题目由 361 穴库实时生成：一穴多角度出题，无限练习 */
  const ANGLES = [
    { id: 'loc',   name: '定位',     sub: 'LOCATION',           desc: '给出穴名，选出正确的定位描述 · Choose the location of a named point', icon: '◎' },
    { id: 'point', name: '认穴',     sub: 'IDENTIFY THE POINT', desc: '给出定位描述，选出对应的穴位 · Identify the point from its location', icon: '◈' },
    { id: 'mer',   name: '归经',     sub: 'MERIDIAN',           desc: '判断穴位归属于哪一条经脉 · Which meridian does the point belong to', icon: '∿' },
    { id: 'acts',  name: '主治',     sub: 'INDICATIONS',        desc: '给出穴名，选出其主要主治 · Choose the main indications', icon: '✚' },
    { id: 'cacts', name: '主治反推', sub: 'INDICATIONS REVERSE', desc: '给出主治病症，选出最对症的穴位 · Which point best matches the indications', icon: '⊕' },
    { id: 'en',    name: '英文名称', sub: 'ENGLISH NAME',       desc: '穴位的国际通用英文名称 · The standard English name', icon: 'A' },
    { id: 'spec',  name: '特定穴属性', sub: 'SPECIAL CATEGORY',  desc: '五输、原络、俞募、八会等特定穴属性 · Five-shu, yuan-luo, shu-mu, influential categories', icon: '◆' },
    { id: 'code',  name: '国际代码', sub: 'WHO CODE',           desc: '穴位的 WHO 国际代号（如 ST36） · WHO code, e.g. ST36', icon: '#' },
    { id: 'anat',  name: '层次解剖', sub: 'ANATOMY',            desc: '给出针刺层次解剖描述，选出对应穴位 · Identify the point from its layer anatomy', icon: '✜' },
    { id: 'depth', name: '针刺深度', sub: 'DEPTH & TECHNIQUE',  desc: '给出穴名，选出正确的针刺深度与操作方法 · Choose the correct depth and technique', icon: '⊥' },
    { id: 'note',  name: '禁忌',     sub: 'CAUTIONS',           desc: '针刺安全提示与禁忌辨析 · Needling cautions and contraindications', icon: '⚠' }
  ];
  const angleById = {};
  ANGLES.forEach(a => { angleById[a.id] = a; });


  let quizState = null;

  /* 由穴位库实时生成的题：一穴多角度（定位/认穴/归经/主治/主治反推/英文/代码） */
  const E = () => (window.AC_EN || {});

  function buildPointQuestion(angle, pool) {
    const src = pool && pool.length >= 4 ? pool : POINTS;
    const inMer = pool && pool.length >= 4;   /* 经络穴位题库模式：只用本经穴位出题 */
    const type = angle || pick(inMer ? ['loc', 'point', 'acts', 'cacts', 'spec', 'code', 'anat', 'depth', 'note']
                                     : ['loc', 'point', 'mer', 'acts', 'cacts', 'en', 'spec', 'code', 'anat', 'depth', 'note']);
    const target = pick(src);
    const enT = E().P[target.c] || {};

    /* 工具：取 n 个不同的干扰穴位（经络题库模式只从本经取，不混入他经穴位） */
    const distract = n => shuffle((inMer ? src : POINTS).filter(p => p.c !== target.c && p.loc !== target.loc && p.acts !== target.acts)).slice(0, n);
    const distractBy = (fn, n) => {
      const seen = new Set([fn(target)]);
      const out = [];
      for (const p of shuffle((inMer ? src : POINTS).slice())) {
        if (p.c === target.c) continue;
        const v = fn(p);
        if (!v || seen.has(v)) continue;
        seen.add(v); out.push(p);
        if (out.length >= n) break;
      }
      return out;
    };

    /* 非本经穴：3 个本经穴 + 1 个他经穴，找出不属于本经的那一个 */
    if (type === 'notmer') {
      const ins = shuffle(src.filter(p => p.c !== target.c)).slice(0, 3);
      const outsider = pick(shuffle(POINTS.filter(p => p.m !== target.m)));
      const opts = shuffle([...ins, outsider]);
      const merEn = (E().MER && E().MER[target.m]) || target.mer.name;
      const outEn = (E().MER && E().MER[outsider.m]) || outsider.mer.name;
      const lbl = p => `${p.n}（${p.c}）`;
      const lblEn = p => `${((E().P[p.c] || {}).en) || p.n} (${p.c})`;
      return {
        type: '非本经穴', lv: 2,
        q: `下列哪个穴位<b>不属于</b>「<em>${target.mer.name}</em>」？`,
        options: opts.map(lbl),
        answer: lbl(outsider),
        explain: `<b>${outsider.n}（${outsider.c}）</b>属${outsider.mer.name}，不属于${target.mer.name}；其余 ${ins.map(p => p.n).join('、')} 均属${target.mer.name}。`,
        en: { q: `Which of the following points does <b>NOT</b> belong to the <i>${merEn}</i>?`,
              o: opts.map(lblEn),
              ex: `<b>${lblEn(outsider)}</b> belongs to the ${outEn}. The other points all belong to the ${merEn}.` }
      };
    }
    if (type === 'mer') {
      const opts = shuffle([target.mer, ...shuffle(MERS.filter(m => m.id !== target.m)).slice(0, 3)]);
      return {
        type: '归经', lv: 1,
        q: `「<em>${target.n}</em>」归属于哪一条经脉？`,
        options: opts.map(m => m.name),
        answer: target.mer.name,
        explain: `<b>${target.n}（${target.c}）</b>属${target.mer.name}。定位：${target.loc}`,
        en: { q: `Which meridian does "<i>${enT.en || target.n}</i>" belong to?`,
              o: opts.map(m => (E().MER && E().MER[m.id]) || m.name),
              ex: `<b>${enT.en || target.n} (${target.c})</b> belongs to the ${(E().MER && E().MER[target.m]) || target.mer.name}. Location: ${enT.locEn || target.loc}` }
      };
    }
    if (type === 'point') {
      const opts = shuffle([target, ...distract(3)]);
      return {
        type: '认穴', lv: 2,
        q: `下列定位描述对应哪个穴位？<br><span style="font-size:13.5px;color:var(--ink2);line-height:1.8">“${target.loc}”</span>`,
        options: opts.map(p => `${p.n}（${p.c}）`),
        answer: `${target.n}（${target.c}）`,
        explain: `<b>${target.n}</b>属${target.mer.name}。主治：${target.acts}`,
        en: { q: `Which point does the following location description match? <span style="font-style:italic">"${enT.locEn || target.loc}"</span>`,
              o: opts.map(p => `${((E().P[p.c] || {}).en) || p.n} (${p.c})`),
              ex: `<b>${enT.en || target.n}</b> belongs to the ${(E().MER && E().MER[target.m]) || target.mer.name}. Indications: ${enT.actsEn || target.acts}` }
      };
    }
    if (type === 'acts') {
      const others = distractBy(p => (E().P[p.c] || {}).acts || p.acts, 3);
      const opts = shuffle([target, ...others]);
      return {
        type: '主治', lv: 2,
        q: `「<em>${target.n}</em>」的主治是？`,
        options: opts.map(p => (E().P[p.c] || {}).acts || p.acts),
        answer: enT.acts || target.acts,
        explain: `<b>${target.c} ${target.n}</b>主治：${target.acts}<br>定位：${target.loc}`,
        en: { q: `What are the main indications of "<i>${enT.en || target.n}</i>"?`,
              o: opts.map(p => (E().P[p.c] || {}).actsEn || p.acts),
              ex: `<b>${target.c} ${enT.en || target.n}</b> — Indications: ${enT.actsEn || target.acts}. Location: ${enT.locEn || target.loc}` }
      };
    }
    if (type === 'cacts') {
      const opts = shuffle([target, ...distract(3)]);
      return {
        type: '主治反推', lv: 3,
        q: `下列主治病症最对症的穴位是？<br><span style="font-size:13.5px;color:var(--ink2);line-height:1.8">${target.acts}</span>`,
        options: opts.map(p => `${p.n}（${p.c}）`),
        answer: `${target.n}（${target.c}）`,
        explain: `<b>${target.c} ${target.n}</b>主治：${target.acts}。定位：${target.loc}`,
        en: { q: `Which point best matches the following indications? <span style="font-style:italic">${enT.actsEn || target.acts}</span>`,
              o: opts.map(p => `${((E().P[p.c] || {}).en) || p.n} (${p.c})`),
              ex: `<b>${target.c} ${enT.en || target.n}</b> — Indications: ${enT.actsEn || target.acts}. Location: ${enT.locEn || target.loc}` }
      };
    }
    if (type === 'en') {
      const others = distractBy(p => ((E().P[p.c] || {}).en) || p.n, 3);
      const opts = shuffle([target, ...others]);
      return {
        type: '英文', lv: 1,
        q: `「<em>${target.n}</em>」的英文名称是？`,
        options: opts.map(p => ((E().P[p.c] || {}).en) || p.n),
        answer: enT.en || target.n,
        explain: `<b>${target.c} ${target.n}</b> = ${enT.en || target.n}。属${target.mer.name}。定位：${target.loc}`,
        en: { q: `What is the English name of "<i>${target.n}</i>" (${target.c})?`,
              o: opts.map(p => ((E().P[p.c] || {}).en) || p.n),
              ex: `<b>${enT.en || target.n}</b> (${target.c}) — ${(E().MER && E().MER[target.m]) || target.mer.name}. Location: ${enT.locEn || target.loc}` }
      };
    }
    if (type === 'spec') {
      const ok = sp => sp && !/非特定穴/.test(sp) && /(井穴|荥穴|输穴|经穴；|合穴|原穴|络穴|郄穴|背俞穴|募穴|八会|下合穴|交会穴)/.test(sp);
      if (!ok(enT.spec || target.spec)) return buildPointQuestion('code');
      const others = shuffle((inMer ? src : POINTS).filter(p => p.c !== target.c && ok(p.spec) && p.spec !== target.spec)).slice(0, 3);
      if (others.length < 3) return buildPointQuestion('code');
      const opts = shuffle([target, ...others]);
      const specOf = p => p.spec;
      const specEnOf = p => ((E().P[p.c] || {}).specEn) || p.spec;
      return {
        type: '特定穴', lv: 2,
        q: `「<em>${target.n}</em>」的特定穴属性是？`,
        options: opts.map(specOf),
        answer: target.spec,
        explain: `<b>${target.c} ${target.n}</b>：${target.spec}。属${target.mer.name}。定位：${target.loc}`,
        en: { q: `What is the special-point category of "<i>${enT.en || target.n}</i>"?`,
              o: opts.map(specEnOf),
              ex: `<b>${target.c} ${enT.en || target.n}</b> — ${enT.spec || target.spec}. ${(E().MER && E().MER[target.m]) || target.mer.name}. Location: ${enT.locEn || target.loc}` }
      };
    }
    /* 针刺深度：给出穴名，从选项中选出正确的深度与操作方法（深度放在选项里） */
    if (type === 'depth') {
      const srcAll = inMer ? src : POINTS;
      const uniqOps = [];
      const seenOp = new Set([target.op]);
      for (const p of shuffle(srcAll.filter(p => p.c !== target.c && p.op))) {
        if (!seenOp.has(p.op)) { seenOp.add(p.op); uniqOps.push(p); }
        if (uniqOps.length >= 3) break;
      }
      if (uniqOps.length < 3) return buildPointQuestion('code');
      const opts = shuffle([target, ...uniqOps]);
      const opEnOf = q => (E().P[q.c] || {}).opEn || q.op;
      return {
        type: '针刺深度', lv: 2,
        q: `「<em>${target.n}</em>」的针刺深度与操作方法是？`,
        options: opts.map(q => q.op),
        answer: target.op,
        explain: `<b>${target.c} ${target.n}</b>：${target.op}`,
        en: { q: `What are the needling depth and technique for "<i>${(E().P[target.c] || {}).en || target.n}</i>"?`,
              o: opts.map(opEnOf),
              ex: `<b>${(E().P[target.c] || {}).en || target.n} (${target.c})</b>: ${(E().P[target.c] || {}).opEn || target.op}` }
      };
    }
    /* 禁忌：给出针刺安全提示，选出对应的穴位 */
    if (type === 'note') {
      const srcAll = inMer ? src : POINTS;
      const cand = srcAll.filter(p => (E().P[p.c] || {}).noteEn);
      if (cand.length < 4) return buildPointQuestion('depth');
      const t2 = pick(cand);
      const seenNote = new Set([t2.c]);
      const others = [];
      for (const p of shuffle(cand.filter(p => p.c !== t2.c))) {
        if ((E().P[p.c] || {}).noteEn !== (E().P[t2.c] || {}).noteEn) { others.push(p); }
        if (others.length >= 3) break;
      }
      if (others.length < 3) return buildPointQuestion('depth');
      const opts = shuffle([t2, ...others]);
      const lbl = q => `${q.n}（${q.c}）`;
      const lblEn = q => `${((E().P[q.c] || {}).en) || q.n} (${q.c})`;
      return {
        type: '禁忌', lv: 3,
        q: `下列针刺安全提示与禁忌针对的是哪个穴位？<br><span style="font-size:13px;color:var(--ink);line-height:1.9">${t2.note || ''}</span><br><span style="font-size:11.5px;color:var(--ink2);line-height:1.8;font-style:italic;font-family:Georgia,serif">${(E().P[t2.c] || {}).noteEn || ''}</span>`,
        options: opts.map(lbl),
        answer: lbl(t2),
        explain: `<b>${t2.c} ${t2.n}</b>：${t2.op}<br><b>注意</b> · ${t2.note || ''}<br><span style="font-style:italic;font-size:11px">${(E().P[t2.c] || {}).noteEn || ''}</span>`,
        en: { q: `Which point does the following needling caution apply to? <span style="font-style:italic">${(E().P[t2.c] || {}).noteEn}</span>`,
              o: opts.map(lblEn),
              ex: `<b>${lblEn(t2)}</b>: ${(E().P[t2.c] || {}).noteEn}` }
      };
    }
    /* 层次解剖：给出针刺层次描述，选出对应穴位 */
    if (type === 'anat') {
      const anatT = (E().P[target.c] || {}).anat || '';
      const anatEn = (E().P[target.c] || {}).anatEn || '';
      if (!anatT) return buildPointQuestion('code');
      const srcAll = inMer ? src : POINTS;
      const others = shuffle(srcAll.filter(p => p.c !== target.c && (E().P[p.c] || {}).anat && (E().P[p.c] || {}).anat !== anatT)).slice(0, 3);
      if (others.length < 3) return buildPointQuestion('code');
      const opts = shuffle([target, ...others]);
      const lbl = q => `${q.n}（${q.c}）`;
      const lblEn = q => `${((E().P[q.c] || {}).en) || q.n} (${q.c})`;
      return {
        type: '解剖', lv: 3,
        q: `下列针刺层次解剖描述对应哪个穴位？<br><span style="font-size:12.5px;color:var(--ink2);line-height:1.9">${anatT}</span>`,
        options: opts.map(lbl),
        answer: lbl(target),
        explain: `<b>${target.c} ${target.n}</b>：${anatT}`,
        en: { q: `Which point matches the following layer-by-layer anatomy? <span style="font-style:italic">${anatEn}</span>`,
              o: opts.map(lblEn),
              ex: `<b>${lblEn(target)}</b>: ${anatEn}` }
      };
    }
    if (type === 'code') {
      const others = inMer
        ? shuffle(src.filter(p => p.c !== target.c)).slice(0, 3)
        : shuffle(POINTS.filter(p => p.c !== target.c && p.c.split(/\d/)[0] !== target.c.split(/\d/)[0])).slice(0, 3);
      const opts = shuffle([target, ...others]);
      return {
        type: '代码', lv: 1,
        q: `「<em>${target.n}</em>」的 WHO 国际代码是？`,
        options: opts.map(p => p.c),
        answer: target.c,
        explain: `<b>${target.c}</b> 即 ${target.n}，属${target.mer.name}。定位：${target.loc}`,
        en: { q: `What is the WHO code of "<i>${enT.en || target.n}</i>"?`,
              o: opts.map(p => p.c),
              ex: `<b>${target.c}</b> = ${enT.en || target.n} — ${(E().MER && E().MER[target.m]) || target.mer.name}. Location: ${enT.locEn || target.loc}` }
      };
    }
    /* loc 定位 */
    const others = shuffle((inMer ? src : POINTS).filter(p => p.c !== target.c && p.loc !== target.loc)).slice(0, 3);
    const opts = shuffle([target, ...others]);
    return {
      type: '定位', lv: 2,
      q: `「<em>${target.n}</em>」的定位是？`,
      options: opts.map(p => p.loc),
      answer: target.loc,
      explain: `<b>${target.c} ${target.n}</b>：${target.loc}<br>主治：${target.acts}`,
      en: { q: `What is the location of "<i>${enT.en || target.n}</i>"?`,
            o: opts.map(p => (E().P[p.c] || {}).locEn || p.loc),
            ex: `<b>${target.c} ${enT.en || target.n}</b>: ${enT.locEn || target.loc} — Indications: ${enT.actsEn || target.acts}` }
    };
  }


  /* 由配穴库出题：选方（病症->主穴）与辨方（主穴->病症） */
  function buildRxQuestion(cat) {
    const c = rxCatBy[cat] || RX[0];
    const x = c.items[Math.floor(Math.random() * c.items.length)];
    const EP = (code) => (window.AC_EN.P[code] || {}).en || '';
    const ptsStr = it => it.p.map(pt => pt[0]).join('、');
    const others = shuffle(RX.flatMap(cc => cc.items).filter(it => it !== x && ptsStr(it) !== ptsStr(x))).slice(0, 3);
    if (Math.random() < 0.5) {
      const opts = shuffle([x, ...others]);
      return {
        type: '配穴选方', lv: 2,
        q: `治疗「<em>${x.t}</em>」的主穴是？`,
        options: opts.map(ptsStr),
        answer: ptsStr(x),
        explain: `<b>${x.t}（${c.cat}）</b>主穴：${ptsStr(x)}。${x.why}`,
        en: { q: `Principal points for <i>"${x.en}"</i>?`,
              o: opts.map(it => it.p.map(pt => EP(pt[1]) || pt[0]).join(', ')),
              ex: `${x.p.map(pt => EP(pt[1]) || pt[0]).join(', ')} — ${x.e}` }
      };
    }
    const opts = shuffle([x, ...others]);
    return {
      type: '配穴辨方', lv: 3,
      q: `处方「<span style="font-size:13.5px;color:var(--ink2)">${ptsStr(x)}</span>」最适用于下列哪类病症？`,
      options: opts.map(it => it.t),
      answer: x.t,
      explain: `<b>${ptsStr(x)}</b> 为「${x.t}」主穴（${c.cat}）。${x.why}`,
      en: { q: `Which condition does the prescription <i>"${x.p.map(pt => EP(pt[1]) || pt[0]).join(', ')}"</i> mainly treat?`,
            o: opts.map(it => `${it.en}`),
            ex: `${x.e} (${x.en}, ${cat})` }
    };
  }

  /* 由技法库出题：要点归类与章节归类 */
  let BULLET_EN = null;
  const bulletEnMap = () => {
    if (!BULLET_EN) {
      BULLET_EN = {};
      TECH.forEach(c => c.items.forEach(it => (it.ul || []).forEach((b, k) => { if (it.ulEn && it.ulEn[k]) BULLET_EN[b] = it.ulEn[k]; })));
    }
    return BULLET_EN;
  };
  function buildTechChapter(cat, i) {
    const c = techCatBy[cat] || TECH[0];
    const x = (i >= 0 && c.items[i]) ? c.items[i] : c.items[Math.floor(Math.random() * c.items.length)];
    const pool = shuffle(c.items.filter(it => it !== x).flatMap(it => it.ul)).filter(b => !x.ul.includes(b)).slice(0, 3);
    if (Math.random() < 0.6 || pool.length < 3) {
      if (pool.length < 3) {
        const extra = shuffle(TECH.flatMap(cc => cc.items).flatMap(it => it.ul).filter(b => !x.ul.includes(b))).slice(0, 3 - pool.length);
        pool.push(...extra);
      }
      const opts = shuffle([x.ul[Math.floor(Math.random() * x.ul.length)], ...pool]);
      return {
        type: '技法要点', lv: 2,
        q: `下列哪一项属于「<em>${x.t}</em>」的操作要点？`,
        options: opts,
        answer: opts.find(o => x.ul.includes(o)),
        explain: `<b>${x.t}（${c.cat}）</b>要点：${x.ul.join('；')}。${x.zh}`,
        en: { q: `Which of the following is a key point of <i>"${x.en}"</i>?`,
              o: opts.map(o => (bulletEnMap()[o] || o)), ex: `${x.e}` }
      };
    }
    const bi = Math.floor(Math.random() * x.ul.length);
    const b = x.ul[bi];
    const bEn = (x.ulEn && x.ulEn[bi]) || b;
    const opts = shuffle([x, ...shuffle(c.items.filter(it => it !== x)).slice(0, 3)]);
    return {
      type: '技法归类', lv: 2,
      q: `要点「<span style="font-size:13.5px;color:var(--ink2)">${b}</span>」出自哪一章？`,
      options: opts.map(it => it.t),
      answer: x.t,
      explain: `<b>${b}</b> 属于「${x.t}」（${c.cat}）。${x.zh}`,
      en: { q: `Which chapter does this key point belong to? <i>"${bEn}"</i>`,
            o: opts.map(it => it.en), ex: `Key point: ${x.ulEn ? x.ulEn[x.ul.indexOf(b)] || '' : ''} — ${x.en}: ${x.e}` }
    };
  }

  /* 按考核代码出题：PC/角度 -> 穴位题；rx:科 -> 配穴题；tch:科:i -> 技法题 */
  function quizQuestion(sub) {
    if (sub.startsWith('mer:')) return buildPointQuestion(null, POINTS.filter(p => p.m === sub.slice(4)));
    if (sub.startsWith('rx:')) return buildRxQuestion(sub.slice(3));
    if (sub.startsWith('tch:')) { const p = sub.split(':'); return buildTechChapter(p[1], Number(p[2])); }
    return buildPointQuestion(sub === 'PC' ? null : sub);
  }

  function newQuiz(sub, n) {
    /* 错题重练模式：从错题本抽取（按错误次数倒序优先） */
    if (sub === 'wrong') {
      const recs = Object.values(wrongBook).sort((a, b) => (b.wrong || 0) - (a.wrong || 0));
      const items = shuffle(recs.map(r => r.item)).slice(0, n);
      return { sub, items, i: 0, right: 0, picked: null, finished: false };
    }
    const items = [];
    const used = new Set();
    let guard = 0;
    while (items.length < n && guard < 600) {
      guard++;
      const q = quizQuestion(sub);
      if (used.has(q.q)) continue;
      used.add(q.q);
      items.push(q);
    }
    return { sub, items, i: 0, right: 0, picked: null, finished: false };
  }

    else if (s.sub.startsWith('mer:')) {

      subject = m ? { name: m.name + ' · 穴位', sub: 'MERIDIAN BANK' } : { name: '经络穴位', sub: 'MERIDIAN BANK' };
    }
    else if (s.sub.startsWith('rx:')) subject = { name: s.sub.slice(3) + ' · 配穴', sub: 'PRESCRIPTION BANK' };
    else if (s.sub.startsWith('tch:')) {
      const p = s.sub.split(':');
      const it = techCatBy[p[1]] && techCatBy[p[1]].items[Number(p[2])];
      subject = it ? { name: it.t, sub: p[1] === '洁针技术' ? 'CNT BANK' : 'TECHNIQUE BANK' } : { name: p[1], sub: 'TECH BANK' };
    }
    else subject = angleById[s.sub] || ANGLES[0];
    setTopbar({ title: subject.name, titleEn: subject.sub, sub: (s.sub && String(s.sub).startsWith('tch:') ? '每组 ' + QUIZ_SIZE + ' 题' : POINTS.length + ' 穴 · ' + QUIZ_SIZE + ' 题'), back: 'quiz' });
    setTab('quiz');

    if (s.finished) {
      const rate = Math.round(s.right / s.items.length * 100);
      const word = rate >= 90 ? '学得很扎实。' : rate >= 70 ? '基础不错，再巩固细节。' : rate >= 50 ? '定位还不够熟，回到经络里再过一遍。' : '别急，先认穴再记定位，一轮一轮来。';
      view.innerHTML = `
        <div class="card result-card" style="margin-top:8px">
          <div class="score">${s.right}<small> / ${s.items.length}</small></div>
          <p>正确率 ${rate}% · Accuracy ${rate}%<br>${word}<br><span style="font-size:10px;font-style:italic;font-family:Georgia,serif">${rate >= 90 ? 'Well grounded.' : rate >= 70 ? 'Good basics — polish the details.' : rate >= 50 ? 'Locations need review — go over the meridians again.' : 'Take it step by step: recognize the points first, then their locations.'}</span></p>
          <button class="btn primary" data-act="again">再来一组 · Again</button>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="k" style="font-size:10.5px;letter-spacing:.22em;color:var(--gold)">本轮回顾 · REVIEW</div>
          ${s.items.map((it, k) => `
            <div style="padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px;line-height:1.7;color:var(--ink2)">
              <span style="color:var(--ink3)">${k + 1}.</span> ${it.type} · ${(QT_EN[it.type] || it.type)} — ${it.answer.replace(/^.*（/, '').replace(/）$/, '')}
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn" data-act="quizhome">返回题库 · Q-Bank</button>
        </div>
        <div style="height:10px"></div>`;
      view.scrollTop = 0;
      return;
    }

    const it = s.items[s.i];
    const answered = s.picked !== null;

    view.innerHTML = `
      <div class="quiz-top">
        <span>${String(s.i + 1).padStart(2, '0')} / ${s.items.length}</span>
        <div class="track"><i style="width:${(s.i / s.items.length) * 100}%"></i></div>
        <span>✓ ${s.right}</span>
      </div>
      <div class="qcard">
        <div class="qtype">${it.type} 题 · 难度 ${'●'.repeat(it.lv || 1)}${'○'.repeat(3 - (it.lv || 1))}</div>
        <div class="qtext">${it.q}${it.en ? `<div style="font-size:11.5px;color:var(--ink3);font-weight:400;line-height:1.65;margin-top:6px;font-style:italic">${it.en.q}</div>` : ''}</div>
        <div class="options">
          ${it.options.map((o, k) => {
            let cls = '';
            if (answered) {
              if (o === it.answer) cls = 'right';
              else if (o === s.picked) cls = 'wrong';
            }
            const fmtOpt = t => {
              const i2 = t.indexOf('：');
              const j2 = t.indexOf(': ');
              return (i2 > 0 && i2 < 12) ? '<b>' + t.slice(0, i2 + 1) + '</b>' + t.slice(i2 + 1)
                   : (j2 > 0 && j2 < 40) ? '<b>' + t.slice(0, j2 + 1) + '</b>' + t.slice(j2 + 1) : t;
            };
            const enTxt = (it.en && it.en.o && it.en.o[k] && it.en.o[k] !== o) ? fmtOpt(it.en.o[k]) : '';
            return `<button class="opt ${cls}" data-opt="${k}" ${answered ? 'disabled' : ''}>
              <span class="idx">${'ABCD'[k]}</span><span>${fmtOpt(o)}${enTxt ? `<span style="display:block;font-size:10px;color:var(--ink3);font-style:italic;line-height:1.55;margin-top:3px">${enTxt}</span>` : ''}</span>
            </button>`;
          }).join('')}
        </div>
      </div>
      ${answered ? `
        <div class="quiz-explain">${s.picked === it.answer ? '答对了。' : '正确答案：<b>' + it.answer + '</b>'}${it.en ? `<div style="font-size:10.5px;color:var(--ink3);font-style:italic;margin-top:3px">${s.picked === it.answer ? 'Correct.' : 'Correct answer: ' + ((it.en.o && it.en.o[it.options.indexOf(it.answer)]) || '')}</div>` : ''}<br>${it.explain}${it.en ? `<div style="font-size:10.5px;color:var(--ink3);font-style:italic;margin-top:4px;line-height:1.7">${it.en.ex}</div>` : ''}</div>
        <div class="quiz-foot">
          <button class="btn primary" data-act="next">${s.i === s.items.length - 1 ? '查看成绩 · Result' : '下一题 · Next'}</button>
        </div>` : ''}
      <div style="height:10px"></div>
    `;
    view.scrollTop = 0;
  }

  /* ---------------- 针灸基础理论 ---------------- */
  const THEORY = [
    { t: '经络系统的组成', en: 'Composition of the Meridian System', zh: '经络系统由十二经脉、奇经八脉、十五络脉及其外围连属部分（十二经别、十二经筋、十二皮部）组成。十二经脉是经络系统的主体，内属脏腑，外络肢节，是气血运行的主要通道；奇经八脉（督、任、冲、带、阴跷、阳跷、阴维、阳维）交叉贯串于十二经之间，调节气血的蓄溢；十五络脉从经脉分出，网络周身，加强表里两经的联系；经别深入体腔加强脏腑联系，经筋连属筋肉骨骼，皮部分布于体表，共同构成一个纵横交错的网络系统。', e: 'The meridian system consists of the twelve regular meridians, the eight extraordinary vessels, the fifteen luo vessels and their appended parts — the twelve divergences (jing bie), sinew channels (jing jin) and cutaneous regions (pi bu). The twelve regular meridians are the trunk of the system: internally they belong to the zang-fu organs, externally link the limbs and joints, and carry qi and blood. The eight extraordinary vessels cross and bind the twelve meridians, storing and regulating the overflow of qi-blood. The fifteen luo vessels branch off to network the body and reinforce the interior-exterior pairing of the meridians; the divergences deepen into the body cavity to strengthen the organ connections, the sinew channels bind muscles and bones, and the cutaneous regions cover the body surface — together forming a crisscrossing network.' },
    { t: '十二经脉的走向与交接', en: 'Flow Direction and Connections of the Twelve Meridians', zh: '十二经脉的走向规律为：「手之三阴，从脏走手；手之三阳，从手走头；足之三阳，从头走足；足之三阴，从足走腹（胸）」。交接规律：相表里的阴经与阳经在四肢末端交接（如肺经与大肠经在食指交接）；同名手足阳经在头面部交接（如手阳明与足阳明在鼻旁交接）；足手阴经在胸部交接（如足太阴脾经与手少阴心经在心中交接）。如此循环流注，如环无端。', e: 'Rule of direction: "the three yin of the hand run from the chest to the hand; the three yang of the hand from the hand to the head; the three yang of the foot from the head to the foot; the three yin of the foot from the foot to the abdomen (chest)". Rules of connection: paired interior-exterior meridians meet at the ends of the four limbs (Lung and Large Intestine meet at the index finger); hand and foot meridians of the same yang name meet at the head and face (hand Yangming and foot Yangming meet beside the nose); foot-yin and hand-yin meridians meet in the chest (Spleen and Heart meet at the heart). Thus the twelve meridians form an endless circulating loop.' },
    { t: '十二经脉气血流注次序', en: 'The Circulation Order of Qi-Blood', zh: '气血流注起于手太阴肺经，依次传至手阳明大肠经、足阳明胃经、足太阴脾经、手少阴心经、手太阳小肠经、足太阳膀胱经、足少阴肾经、手厥阴心包经、手少阳三焦经、足少阳胆经、足厥阴肝经，最后复注于肺经，周而复始。配合时辰：肺寅、大肠卯、胃辰、脾巳、心午、小肠未、膀胱申、肾酉、心包戌、三焦亥、胆子、肝丑。', e: 'Qi-blood starts from the Hand Taiyin Lung Meridian and flows in order through LI → ST → SP → HT → SI → BL → KI → PC → TE → GB → LR, finally returning to the Lung meridian, round without end. Matched to the double-hours: Lung-yin (3–5am), LI-mao (5–7), ST-chen (7–9), SP-si (9–11), HT-wu (11–13), SI-wei (13–15), BL-shen (15–17), KI-you (17–19), PC-xu (19–21), TE-hai (21–23), GB-zi (23–1), LR-chou (1–3am).' },
    { t: '五输穴：井、荥、输、经、合', en: 'The Five Shu Points: Jing-Well, Ying-Spring, Shu-Stream, Jing-River, He-Sea', zh: '五输穴是十二经脉分布在肘膝以下的五个特定穴，按经气由浅入深分为：井穴（手足末端，经气初出如水之源，主急证、昏迷、发热，多用于点刺放血）、荥穴（掌指或跖趾关节前，经气渐盛如泉之流，主身热）、输穴（关节附近，经气渐盛如水流注，主体重节痛，阴经输穴兼为原穴）、经穴（前臂/小腿，经气正盛如水通行，主喘咳寒热）、合穴（肘膝附近，经气深入如水汇合入海，主逆气而泄）。古人以阴阳五行配属：阴经井木、荥火、输土、经金、合水；阳经井金、荥水、输木、经火、合土。据此可施行「子母补泻」（本经补母泻本穴或取他经），如肝实证泻其子穴行间（火）。', e: 'The five shu points are five special points of each meridian below the elbow and knee, arranged as meridian qi flows from shallow to deep: Jing-well (at the tips of the digits — qi first emerges like the source of a spring; treat emergencies, coma and fever, often by pricking to bleed), Ying-spring (before the MCP/MTP joints — qi trickles like a flowing spring; treat body heat), Shu-stream (near the wrist/ankle — qi swells like a steadily flowing stream; treat heaviness of the body and joint pain; in yin meridians it doubles as the yuan-source point), Jing-river (on the forearm/leg — qi runs like a broad river; treat wheezing, cough, chills and fever), He-sea (near the elbow/knee — qi converges like rivers into the sea; treat counterflow qi and diarrhea). The ancients matched them with the five elements: yin meridians — well-wood, spring-fire, stream-earth, river-metal, sea-water; yang meridians — well-metal, spring-water, stream-wood, river-fire, sea-earth. On this basis the mother-son tonification-drainage method is applied: e.g. in liver excess, drain the "son" point Xingjian (LR2, fire).' },
    { t: '原穴与络穴', en: 'Yuan-Source Points and Luo Points', zh: '原穴是脏腑原气经过和留止的部位，十二经各有一个，阴经以输穴为原，阳经于输穴之后另有原穴。原穴反映脏腑盛衰，「五脏有疾，当取之十二原」，临床用于诊察和治疗相关脏腑的虚损性病变。络穴是络脉从经脉别出的部位，共15个（十二经+任脉鸠尾、督脉长强、脾之大络大包），能沟通表里两经，既治本经病，也治相表里经脉的病。原穴与络穴配合使用（原络配穴/主客配穴），以先病经脉之原穴为主、表里经之络穴为客。', e: 'The yuan-source points are where the original qi of the zang-fu organs passes and lingers — one on each of the twelve meridians; yin meridians take the shu-stream point as yuan, while yang meridians have a separate yuan point after the shu point. They mirror the strength of the organs — "when the five zang are diseased, take the twelve yuan" — and are used to diagnose and treat deficiency-type disorders of the corresponding organs. The luo points (15 in all: the twelve meridians plus Jiuwei CV15 of Ren, Changqiang GV1 of Du, and Dabao SP21, the great luo of the spleen) mark where luo vessels depart; they connect interior-exterior meridians, treating disorders of both. The yuan-luo (host-guest) combination takes the yuan point of the primarily diseased meridian as host and the luo point of its paired meridian as guest.' },
    { t: '背俞穴与募穴', en: 'Back-Shu Points and Front-Mu Points', zh: '背俞穴是脏腑之气输注于腰背部的腧穴，位于足太阳膀胱经上，距后正中线1.5寸，大体依脏腑位置高低排列（如肺俞平第3胸椎、肾俞平第2腰椎），主治相应脏腑病及与该脏腑相关的五官、皮肉筋骨病。募穴是脏腑之气汇聚于胸腹部的腧穴（如中府、关元、天枢），「前募后俞」，主治相应脏腑的急性实证。俞穴与募穴前后配合使用（俞募配穴），如肺病取肺俞配中府，前后呼应，疗效更佳。', e: 'Back-shu points are where the qi of the zang-fu infuses the back, on the Bladder meridian 1.5 cun lateral to the posterior midline, arranged roughly by the anatomical level of the organs (Feishu BL13 level with T3, Shenshu BL23 with L2); they treat diseases of their corresponding organs and related sense-organs, skin, muscles, tendons and bones. Front-mu points are where zang-fu qi gathers on the chest and abdomen (Zhongfu, Guanyuan, Tianshu, etc.); they treat acute excess conditions of the corresponding organs. Used together (the shu-mu combination, echoing front and back) the effect is enhanced — e.g. lung disease: Feishu (BL13) with Zhongfu (LU1).' },
    { t: '郄穴与下合穴', en: 'Xi-Cleft Points and Lower He-Sea Points', zh: '郄穴是各经经气深聚的部位，共16个（十二经+阴跷、阳跷、阴维、阳维各一），多分布于四肢肘膝以下。郄穴「间隙如沟渠」，经气深聚，最能反映经脉的急性病变，擅长治疗本经循行部位及所属脏腑的急性病证和血证，如孔最（肺）治咯血、地机（脾）治痛经急性发作。下合穴是六腑之气下合于足三阳经的六个腧穴（胃足三里、大肠上巨虚、小肠下巨虚、膀胱委中、三焦委阳、胆阳陵泉），「合治内腑」，是治疗六腑病证的主要腧穴。', e: 'Xi-cleft points (16 in all: the twelve meridians plus one each of the Yin qiao, Yang qiao, Yin wei and Yang wei vessels) are where meridian qi pools deeply, mostly below the elbow and knee. Being deep gathering-spots, they best reflect acute disorders of their meridian and excel at treating acute conditions and bleeding disorders of the meridian\'s course and its organ — e.g. Kongzui (LU6) for hemoptysis, Diji (SP8) for acute dysmenorrhea. The six lower he-sea points are where the qi of the six fu organs converges on the three foot yang meridians: ST36 (stomach), Shangjuxu ST37 (large intestine), Xiajuxu ST39 (small intestine), Weizhong BL40 (bladder), Weiyang BL39 (triple burner), Yanglingquan GB34 (gallbladder) — "he points treat the interior fu", making them the principal points for six-fu diseases.' },
    { t: '八会穴', en: 'The Eight Influential Points', zh: '八会穴是脏、腑、气、血、筋、脉、骨、髓八类精气汇聚的八个腧穴：脏会章门、腑会中脘、气会膻中、血会膈俞、筋会阳陵泉、脉会太渊、骨会大杼、髓会悬钟（绝骨）。凡与此八类相关的病变，均可取相应会穴治疗，如筋病取阳陵泉、血证取膈俞、髓病取悬钟。八会穴分布分散，分属不同经脉，但临床应用广泛，常与远端取穴配合。', e: 'The eight influential (meeting) points are where the essential qi of zang, fu, qi, blood, tendon, vessel, bone and marrow gathers: zang—Zhangmen (LR13), fu—Zhongwan (CV12), qi—Danzhong (CV17), blood—Geshu (BL17), tendon—Yanglingquan (GB34), vessel—Taiyuan (LU9), bone—Dazhu (BL11), marrow—Xuanzhong (GB39). Diseases related to these eight categories can be treated with the corresponding point: tendon disorders with GB34, blood disorders with BL17, marrow disorders with GB39, and so on. Though scattered across different meridians, they are widely used, often combined with distal point selection.' },
    { t: '八脉交会穴', en: 'The Eight Confluent Points', zh: '八脉交会穴是十二经脉与奇经八脉相通的八个腧穴：公孙（通冲脉）、内关（通阴维）、后溪（通督脉）、申脉（通阳跷）、足临泣（通带脉）、外关（通阳维）、列缺（通任脉）、照海（通阴跷）。四对经典配伍：公孙配内关治胃、心、胸疾患；后溪配申脉治目内眦、颈项、耳、肩膊疾患；足临泣配外关治目锐眦、耳后、颊、颈、肩疾患；列缺配照海治肺系、咽喉、胸膈疾患。临床常配合灵龟八法按时取穴。', e: 'The eight confluent points are the eight points where the twelve meridians communicate with the eight extraordinary vessels: Gongsun SP4 (Chong Mai), Neiguan PC6 (Yin wei), Houxi SI3 (Du Mai), Shenmai BL62 (Yang qiao), Zulinqi GB41 (Dai Mai), Waiguan TE5 (Yang wei), Lieque LU7 (Ren Mai), Zhaohai KI6 (Yin qiao). Four classical pairs: SP4 with PC6 for disorders of the stomach, heart and chest; SI3 with BL62 for the inner canthus, nape, ear and shoulder; GB41 with TE5 for the outer canthus, behind the ear, cheek, neck and shoulder; LU7 with KI6 for the lung system, throat, chest and diaphragm. Clinically they may also be applied by the Linggui Bafa (magic turtle eight methods) of point selection by time.' },
    { t: '十五络脉', en: 'The Fifteen Luo Vessels', zh: '十五络脉是从十二经脉、任脉、督脉各自分出的一支络脉，加上脾之大络，共十五条。十二经别络从四肢肘膝以下的络穴分出，走向相表里的经脉，加强表里两经的联系；任脉之络散布于腹部，督脉之络夹脊柱两侧、贯头散肩胛，脾之大络散布于胸胁。络脉沟通表里、渗灌气血，浮于体表可见者为浮络、孙络，共同组成网络全身的经络细网。', e: 'The fifteen luo vessels are one branch departing from each of the twelve meridians, the Ren Mai and the Du Mai, plus the great luo of the spleen — fifteen in all. The twelve meridian luo branches depart from luo points below the elbow and knee, heading toward the paired (interior-exterior) meridians and binding the pairs together; the Ren luo spreads over the abdomen, the Du luo flanks the spine, passes through the head and scatters over the shoulder blades, and the spleen great luo spreads over the chest and hypochondrium. The luo vessels link the interior-exterior pairs and seep qi-blood outward; those visible at the surface are the floating luo (fu luo) and grandchild luo (sun luo), forming the fine network over the whole body.' },
    { t: '奇经八脉', en: 'The Eight Extraordinary Vessels', zh: '奇经八脉包括督脉、任脉、冲脉、带脉、阴跷脉、阳跷脉、阴维脉、阳维脉，与十二正经不同：不直接属脏腑、无表里配合、除督任外无本经腧穴。主要功能：①进一步密切十二经脉的联系（如督脉总督一身之阳、任脉总任一身之阴、冲脉为「十二经之海/血海」、带脉约束纵行诸经）；②调节十二经脉的气血，蓄则溢、虚则渗；③与肝、肾、女子胞等关系密切，故妇科病常用奇经理论论治。临床将八脉交会穴与八脉配合应用。', e: 'The eight extraordinary vessels — Du, Ren, Chong, Dai, Yin qiao, Yang qiao, Yin wei and Yang wei — differ from the twelve regular meridians: they do not directly belong to zang-fu organs, have no interior-exterior pairing, and (except Du and Ren) no points of their own. Main functions: ① they further bind the twelve meridians together (the Du governs all the yang of the body, the Ren governs all the yin, the Chong is the "sea of the twelve meridians / sea of blood", and the Dai binds the vertically running meridians); ② they store and regulate the qi-blood of the twelve meridians — filling the meridians when abundant, seeping into them when deficient; ③ they are closely related to the liver, kidney and uterus, hence their importance in gynecological treatment. Clinically the eight confluent points are used together with the vessels.' },
    { t: '得气与刺法要则', en: 'Deqi and Principles of Needling', zh: '得气（气至）是针刺的基本要求，表现为患者酸、麻、胀、重，医者针下沉紧如鱼吞钓。刺法则分补泻：补法进针慢、捻转角度小、用力轻、退针快；泻法进针快、捻转角度大、用力重、退针慢。「虚则补之，实则泻之，菀陈则除之，邪胜则虚之」。留针时间一般为10~20分钟。另须遵循清洁针术（CNT）：一次性无菌针具、严格皮肤消毒（直径≥5cm）、锐器入锐器盒。', e: 'Deqi (arrival of qi) is the basic requirement of needling: the patient feels soreness, numbness, distension or heaviness, while the practitioner feels the needle grip becoming tight and heavy, "like a fish swallowing the bait". Techniques divide into reinforcing and draining: the reinforcing method inserts slowly, twists with a small angle and gentle force, and withdraws quickly; the draining method inserts quickly, twists widely and strongly, and withdraws slowly — "what is deficient, tonify; what is excess, drain; what is stagnant, remove; what pathogenic is strong, disperse". Needle retention generally lasts 10–20 minutes. Clean Needle Technique (CNT) must be followed: single-use sterile needles, skin antisepsis of at least 5 cm diameter, sharps disposed into sharps containers.' },
    { t: '骨度分寸定位法', en: 'Bone-Length Proportional Cun Measurements', zh: '骨度分寸法是以人体骨节为标志，将全身各部位按比例折算为一定寸数（骨度折量寸）来定穴的方法，不受身材高矮影响。常用骨度：天突至歧骨（胸剑联合）9寸，歧骨至脐8寸，脐至耻骨联合上缘5寸；两乳头之间8寸；腋前纹头至肘横纹9寸，肘横纹至腕横纹12寸；髀枢至膝中19寸，膝中至外踝尖16寸；后发际至大椎3寸，大椎以下至尾骶21寸；臀横纹至腘横纹14寸；内踝尖至足底3寸。本库人体图两侧所绘标尺即为骨度分寸，可对照取穴。', e: 'The bone-length method defines points by taking the bones and joints as landmarks and dividing each body region into proportional "cun" units, so it is independent of body height. Common measurements: Tiantu (CV22) to the sternoxiphoid joint 9 cun; sternoxiphoid to the navel 8 cun; navel to the upper border of the pubic symphysis 5 cun; between the nipples 8 cun; anterior axillary fold to elbow crease 9 cun; elbow crease to wrist crease 12 cun; greater trochanter to the middle of the knee 19 cun; knee to the tip of the lateral malleolus 16 cun; posterior hairline to Dazhui (GV14) 3 cun; Dazhui to the sacral end 21 cun; gluteal crease to popliteal crease 14 cun; tip of the medial malleolus to the sole 3 cun. The rulers drawn on the body figure in this library mark these bone-length cun for point location.' },
    { t: '手指同身寸与一夫法', en: 'Finger Cun Measurements (Including the Four-Finger Method)', zh: '手指同身寸是以患者本人的手指宽度为标准折量定穴（医者也可用自己的手指按比例量取患者的身体）：①中指同身寸——中指中节屈曲时两端纹头之间为1寸；②拇指同身寸——拇指指间关节的宽度为1寸；③横指同身寸（一夫法）——食、中、无名、小指四指并拢，以中指中节横纹处为准，四指宽度为3寸，「一夫」即四指并拢之宽度，如足三里在犊鼻下3寸，可用一夫法量取；④二横指（食中二指并拢）约1.5寸。指寸法多用于四肢部及腹部，应与骨度分寸互相参照。', e: 'Finger measurement takes the patient\'s own fingers as the standard (the practitioner may use their own fingers proportionally on the patient\'s body): ① middle-finger cun — the distance between the two ends of the flexed middle crease of the patient\'s middle finger is 1 cun; ② thumb cun — the width of the thumb\'s interphalangeal joint is 1 cun; ③ four-finger method (yi fu, "one husband") — with the index, middle, ring and little fingers close together, measured at the level of the middle crease of the middle finger, the combined width is 3 cun; e.g. Zusanli (ST36), 3 cun below Dubi (ST35), is measured this way; ④ two fingers (index + middle) together are about 1.5 cun. Finger cun are mostly used on the limbs and abdomen and should be cross-checked against the bone-length cun.' },
  ];

  async function doShare() {
    /* 优先调用系统分享面板（iOS/Android 均可直接选微信、短信、邮件） */
    if (navigator.share) {
      try {
        /* 尝试连分享封面图一起带上（支持文件分享的平台会显示图片） */
        try {
          const resp = await fetch(SHARE_COVER);
          if (resp.ok) {
            const blob = await resp.blob();
            const file = new File([blob], 'acu361-share.png', { type: 'image/png' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: SHARE_TITLE, text: SHARE_TITLE + '\n' + SHARE_TEXT + '\n' + SHARE_URL });
              return;
            }
          }
        } catch (e2) { /* 图片分享失败，继续走普通链接分享 */ }
        await navigator.share({ title: SHARE_TITLE, text: SHARE_TEXT, url: SHARE_URL });
        return;
      } catch (err) {
        /* 用户取消就不提示；其他错误落到复制 */
        if (err && err.name === 'AbortError') return;
      }
    }
    copyLink();
  }

  async function copyLink() {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(SHARE_URL);
      } else {
        const ta = document.createElement('textarea');
        ta.value = SHARE_URL;
        ta.style.cssText = 'position:fixed;top:-999px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      toast('链接已复制，去微信粘贴发送 · Link copied');
    } catch (e) {
      toast('请手动复制：' + SHARE_URL);
    }
  }
