  align-items: center;
  gap: 10px;
  padding: 11px 12px 11px 14px;
  background: rgba(255, 253, 248, .97);

.a2hs-t {

  white-space: nowrap;
}
.a2hs-s {

.a2hs-how {

  font-size: 11.5px;

}

.a2hs-x {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;

}

.a2hs-mask {

}

.a2hs-sheet {

}

.a2hs-sheet h3 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: .08em;
  font-family: 'Palatino', 'Songti SC', 'STSong', 'Noto Serif SC', Georgia, serif;
}
.a2hs-sheet .sub {
  margin-top: 4px;

  letter-spacing: .1em;
  font-style: italic;

}
.a2hs-step {

  align-items: flex-start;

}
.a2hs-num {

  height: 21px;
  border-radius: 50%;

}

.a2hs-step .tx .en {

  font-size: 12px;

}

  display: flex;

}

  background: var(--line);

}

}

.qcard {

}

}

  font-style: normal;

}

.options { margin-top: 18px; display: flex; flex-direction: column; gap: 9px; }
.opt {

}

  font-size: 10.5px;
  background: var(--line-soft);
  color: var(--ink2);
}
.opt:active { background: #f8f2e4; }
.opt.right { border-color: #78a07f; background: #eef6ee; }

.opt.wrong { border-color: #cf8b7c; background: #fbeeea; }

.quiz-foot { margin-top: 16px; }
.quiz-explain {
  margin-top: 14px;
  padding: 12px 14px;
  background: #f7f2e6;
  border-radius: 12px;
  font-size: 12px;
  line-height: 1.8;
  color: var(--ink2);
  letter-spacing: .02em;
}

}

P:{"LU1":{"en":"Middle Chest Shu","locEn":"On the chest, level with the 1st intercostal space, the infraclavicular fossa the lateral side, 6 cun lateral to the anterior midline.","actsEn":"Cough, wheezing and dyspnea, chest oppression, shoulder and back pain.","specEn":"Front-Mu point of the Lung; meeting point of the Hand Taiyin and Foot Taiyin Meridians","anat":"皮肤→皮下组织→胸大肌→胸小肌外侧缘。浅层布有锁骨上神经中间支、第1肋间神经前皮支；深层有胸前神经分支及头静脉起始部。内侧为肺尖与胸膜顶，深刺可致气胸。","anatEn":"Skin → subcutaneous tissue → pectoralis major → lateral border of pectoralis minor. Superficially the intermediate supraclavicular nerve and anterior cutaneous branch of the 1st intercostal nerve; deeply branches of the pectoral nerves and the origin of the cephalic vein. Medially lie the apex of the lung and the cupula of the pleura; deep needling risks pneumothorax.","opEn":"Insert obliquely or transversely 0.5-0.8 cun laterally. Moxibustion is applicable.","noteEn":"Do not insert deeply inward, to avoid injuring the lung."},"LU5":{"en":"Cubit Marsh","locEn":"In the cubital region, on the cubital crease, in the depression on the radial side of the tendon of m. biceps brachii.","actsEn":"Cough, wheezing and dyspnea, hemoptysis, tidal fever, sore and swollen throat, contracture and pain of the elbow and arm.","specEn":"He-Sea point (Water)","anat":"皮肤→皮下组织→肘桡侧副韧带与桡侧返动静脉；肱桡肌起始部与肱二头肌腱之间。浅层有前臂外侧皮神经；深层为桡神经干分出处。","anatEn":"Skin → subcutaneous tissue → radial collateral ligament of the elbow with the radial recurrent vessels; between the origin of brachioradialis and the biceps tendon. Superficially the lateral antebrachial cutaneous nerve; deeply near the origin/termination of the radial nerve.","opEn":"Insert perpendicularly 0.8-1.2 cun, or prick with a fine needle to bleed. Moxibustion is applicable.","noteEn":"For acute vomiting and diarrhea, the point may be pricked to bleed."},"LU6":{"en":"Greatest Hole","locEn":"In the anterior antebrachial region, 7 cun above the distal palmar wrist crease, on the line connecting LU5 Avoiding the radial artery, insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Meeting point of the vessels (Mai Hui); the radial pulse is felt here — avoid the artery when needling."},"LU10":{"en":"Fish Border","locEn":"On the lateral side of the hand, at the midpoint of the radial side of the 1st metacarpal bone at the red-white skin junction.","actsEn":"Cough, hemoptysis, dry throat, sore and swollen throat, loss of voice, fever.","specEn":"Ying-Spring point (Fire)","anat":"皮肤→皮下组织→掌腱膜→指浅、深屈肌腱之间。神经血管：臂外侧皮神经（C5~T1）、桡神经浅支；血管：头静脉、桡动静脉。","anatEn":"Skin → subcutaneous tissue → palmar aponeurosis → between the tendons of flexor digitorum superficialis and profundus. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"As the Ying-Spring point it governs body heat; effective for clearing lung heat."},"LU11":{"en":"Lesser Shang","locEn":"On the finger, the thumb on the radial side of the distal phalanx, 0.1 cun lateral to the corner of the nail root.","actsEn":"Sore and swollen throat, nosebleed, fever, coma, manic-depressive psychosis.","specEn":"Jing-Well point (Wood)","anat":"皮肤→皮下组织→指骨骨膜；两侧为指掌侧固有神经、血管。神经血管：臂外侧皮神经（C5~T1）、桡神经浅支；血管：头静脉、桡动静脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx; bilaterally the proper palmar digital nerves and vessels. ","opEn":"Insert superficially 0.1 cun, or prick with a fine needle to bleed.","noteEn":"Pricking to bleed is a common method for acute sore and swollen throat."},"LI1":{"en":"Shang Yang","locEn":"On the finger, the index finger on the radial side of the distal phalanx, 0.1 cun lateral to the corner of the nail root.","actsEn":"Sore and swollen throat, toothache, fever, coma, numbness of the fingers.","specEn":"Jing-Well point (Metal)","anat":"皮肤→皮下组织→指骨骨膜；两侧为指掌侧固有神经、血管。神经血管：臂后皮神经与前臂后皮神经（C5~T1）、桡神经；血管：头静脉、桡动脉分支。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx; bilaterally the proper palmar digital nerves and vessels. ","opEn":"Insert superficially 0.1 cun, or prick with a fine needle to bleed.","noteEn":"Often used together with Shaoshang (LU11) for bloodletting in swollen sore throat."},"LI4":{"en":"Union Valley","locEn":"On the dorsum of the hand, at the midpoint of the radial side of the 2nd metacarpal bone.","actsEn":"Headache, toothache, red, swollen and painful eyes, sore and swollen throat, deviation of the mouth and eye, fever, amenorrhea, prolonged labor.","specEn":"Yuan-Source point; one of the Four Command points","anat":"皮肤→皮下组织→第1骨间背侧肌→拇收肌。浅层布有桡神经浅支、手背静脉网；深层有第一掌背动脉与尺神经深支。","anatEn":"Skin → subcutaneous tissue → 1st dorsal interosseous muscle → adductor pollicis. Superficially the superficial branch of the radial nerve and dorsal venous network; deeply the 1st dorsal metacarpal artery and deep branch of the ulnar nerve.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Use with caution in pregnancy (it promotes circulation); as the saying goes, \"for face and mouth problems, seek Hegu\"."},"LI5":{"en":"Yang Ravine","locEn":"In the wrist region, the distal dorsal wrist crease the radial side, in the anatomical \"snuffbox\".","actsEn":"Headache, red, swollen and painful eyes, toothache, wrist pain.","specEn":"Jing-River point (Fire)","anat":"皮肤→皮下组织→腕横韧带/腕背侧支持带及肌腱之间。神经血管：臂后皮神经与前臂后皮神经（C5~T1）、桡神经；血管：头静脉、桡动脉分支。","anatEn":"Skin → subcutaneous tissue → flexor/dorsal retinaculum and between tendons of the wrist. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"LI6":{"en":"Veering Passageway","locEn":"In the forearm, 3 cun above the distal dorsal wrist crease, on the line connecting LI5 (Yangxi) and LI11 (Quchi).","actsEn":"Tinnitus, nosebleed, edema, throat pain.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂后皮神经与前臂后皮神经（C5~T1）、桡神经；血管：头静脉、桡动脉分支。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly or obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Commonly used as a practice point for needling techniques."},"LI10":{"en":"Arm Three Li","locEn":"In the forearm, 2 cun below the cubital crease, on the line connecting LI5 (Yangxi) and LI11 (Quchi).","actsEn":"Abdominal pain, toothache, motor impairment of the upper limb.","specEn":"Hand Yangming Jing-River point (non-special point)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂后皮神经与前臂后皮神经（C5~T1）、桡神经；血管：头静脉、桡动脉分支。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.8-1.2 cun. Moxibustion is applicable.","noteEn":"Commonly used for weakness, pain and soreness of the upper limb."},"LI11":{"en":"Pool at the Crook","locEn":"In the cubital region, at the midpoint of the line connecting LU5 (Chize) and the lateral epicondyle of the humerus.","actsEn":"Fever, sore and swollen throat, toothache, urticarial wheals, eczema, motor impairment of the upper limb, abdominal pain, hypertension.","specEn":"He-Sea point (Earth)","anat":"皮肤→皮下组织→桡侧腕长伸肌与桡侧腕短伸肌之间→肱桡肌。浅层有前臂后皮神经、头静脉；深层布有桡神经深支、桡侧副动静脉。是肘部最常用的深层软组织松解靶点。","anatEn":"Skin → subcutaneous tissue → between extensor carpi radialis longus and brevis → brachioradialis. Superficially the posterior antebrachial cutaneous nerve and cephalic vein; deeply the deep branch of the radial nerve and radial collateral vessels.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Key point for clearing heat; commonly used for skin diseases."},"LI14":{"en":"Arm Niao","locEn":"On the upper arm, 7 cun above LI11 (Quchi), on the anterior border of m. deltoideus.","actsEn":"Scrofula.","specEn":"Hand Yangming, the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→肱二头肌/肱三头肌。神经血管：臂后皮神经与前臂后皮神经（C5~T1）、桡神经；血管：头静脉、桡动脉分支。","anatEn":"Skin → subcutaneous tissue → biceps brachii / triceps brachii. ","opEn":"Insert perpendicularly or obliquely 0.8-1.5 cun upward. Moxibustion is applicable.","noteEn":"Commonly used in acupuncture anesthesia for ophthalmic surgery."},"LI15":{"en":"Shoulder Bone","locEn":"In the deltoid region, the anterior end of the lateral border of the acromion and the greater tubercle of the humerus in the depression between the two bones.","actsEn":"Motor impairment of the upper limb, urticarial wheals.","specEn":"Hand Yangming, the Yang Heel Vessel (Yangqiao) crossing (meeting) point","anat":"皮肤→皮下组织→三角肌与冈上肌之间的肩峰下囊。浅层有锁骨上神经外侧支；深层为腋神经分支、旋肱后动脉。","anatEn":"Skin → subcutaneous tissue → the subacromial bursa between deltoid and supraspinatus. Superficially the lateral supraclavicular nerve; deeply the axillary nerve and posterior circumflex humeral artery.","opEn":"Insert perpendicularly or obliquely 0.8-1.5 cun downward. Moxibustion is applicable.","noteEn":"A main point for periarthritis of the shoulder (frozen shoulder)."},"LI20":{"en":"Welcome Fragrance","locEn":"On the face, lateral to the midpoint of the outer border of the ala nasi, in the nasolabial groove.","actsEn":"Nasal congestion, nosebleed, sinusitis, deviation of the mouth and eye.","specEn":"Hand Yangming, Foot Yangming crossing (meeting) point","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：臂后皮神经与前臂后皮神经（C5~T1）、桡神经；血管：头静脉、桡动脉分支。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Obliquely or transversely insert slightly superomedially 0.3-0.5 cun.","noteEn":"Moxibustion is not suitable; a key point for nasal disorders."},"HT1":{"en":"Summit Spring","locEn":"In the axillary region, at the center of the axilla, where the pulsation of the axillary artery is felt.","actsEn":"Cardiac pain, scrofula, motor impairment of the upper limb.","specEn":"Hand Shaoyin Jing-River point (non-special point)","anat":"皮肤→皮下组织→腋窝疏松结缔组织，深部为腋动脉鞘。神经血管：臂内侧皮神经、前臂内侧皮神经（C8~T1）、尺神经、正中神经；血管：贵要静脉、尺动静脉。","anatEn":"Skin → subcutaneous tissue → loose connective tissue of the axilla; deeply the axillary artery sheath. ","opEn":"Avoiding the axillary artery, insert perpendicularly or obliquely 0.3-0.5 cun.","noteEn":"Avoid the axillary artery when needling."},"HT3":{"en":"Lesser Sea","locEn":"In the anterior cubital region, level with the cubital crease, the medial epicondyle of the humerus the anterior border.","actsEn":"Cardiac pain, contracture and pain of the elbow and arm, hand tremor, scrofula, hypochondriac pain.","specEn":"He-Sea point (Water)","anat":"皮肤→皮下组织→肘关节周围肌腱。神经血管：臂内侧皮神经、前臂内侧皮神经（C8~T1）、尺神经、正中神经；血管：贵要静脉、尺动静脉。","anatEn":"Skin → subcutaneous tissue → tendons around the elbow joint. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":""},"HT5":{"en":"Penetrating Interior","locEn":"In the anterior antebrachial region, 1 cun above the distal palmar wrist crease, on the radial side of the tendon of m. flexor carpi ulnaris.","actsEn":"Palpitations, severe palpitations, sudden hoarseness/loss of voice, stiff tongue with aphasia, arm pain.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂内侧皮神经、前臂内侧皮神经（C8~T1）、尺神经、正中神经；血管：贵要静脉、尺动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Commonly used for aphasia after stroke."},"HT6":{"en":"Yin Cleft","locEn":"In the anterior antebrachial region, 0.5 cun above the distal palmar wrist crease, on the radial side of the tendon of m. flexor carpi ulnaris.","actsEn":"Cardiac pain, palpitations with fear, night sweats.","specEn":"Xi-Cleft point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂内侧皮神经、前臂内侧皮神经（C8~T1）、尺神经、正中神经；血管：贵要静脉、尺动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Effective for night sweats due to yin deficiency."},"HT7":{"en":"Spirit Gate","locEn":"In the anterior wrist region, the ulnar end of the distal palmar wrist crease, on the radial side of the tendon of m. flexor carpi ulnaris.","actsEn":"Cardiac pain, vexation, palpitations with fear, severe palpitations, poor memory, insomnia, manic-depressive psychosis.","specEn":"Shu-Stream point; Yuan-Source point","anat":"皮肤→皮下组织→尺侧腕屈肌腱与尺骨之间。浅层有前臂内侧皮神经、贵要静脉；深层为尺神经与尺动静脉（尺管远端）。","anatEn":"Skin → subcutaneous tissue → between the tendon of flexor carpi ulnaris and the ulna. Superficially the medial antebrachial cutaneous nerve and basilic vein; deeply the ulnar nerve and vessels (distal ulnar tunnel).","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Key point for calming the mind; commonly used for insomnia."},"HT8":{"en":"Lesser Mansion","locEn":"On the palm, at the level of, proximal to the 5th metacarpophalangeal joint, between the 4th and 5th metacarpal bones.","actsEn":"Palpitations, chest pain, difficult urination, enuresis, genital itching.","specEn":"Ying-Spring point (Fire)","anat":"皮肤→皮下组织→掌腱膜→指浅、深屈肌腱之间。神经血管：臂内侧皮神经、前臂内侧皮神经（C8~T1）、尺神经、正中神经；血管：贵要静脉、尺动静脉。","anatEn":"Skin → subcutaneous tissue → palmar aponeurosis → between the tendons of flexor digitorum superficialis and profundus. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"HT9":{"en":"Lesser Rushing","locEn":"On the finger, the little finger on the radial side of the distal phalanx, 0.1 cun lateral to the corner of the nail root.","actsEn":"Palpitations, cardiac pain, manic-depressive psychosis, coma.","specEn":"Jing-Well point (Wood)","anat":"皮肤→皮下组织→指骨骨膜；两侧为指掌侧固有神经、血管。神经血管：臂内侧皮神经、前臂内侧皮神经（C8~T1）、尺神经、正中神经；血管：贵要静脉、尺动静脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx; bilaterally the proper palmar digital nerves and vessels. ","opEn":"Insert superficially 0.1 cun, or prick with a fine needle to bleed.","noteEn":"Commonly used in first aid."},"SI1":{"en":"Lesser Marsh","locEn":"On the finger, the little finger on the ulnar side of the distal phalanx, 0.1 cun lateral to the corner of the nail root.","actsEn":"Insufficient lactation, mastitis, sore and swollen throat, coma.","specEn":"Jing-Well point (Metal)","anat":"皮肤→皮下组织→指骨骨膜；两侧为指掌侧固有神经、血管。神经血管：臂后皮神经、尺神经手背支（C8~T1）；血管：贵要静脉、尺动脉分支。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx; bilaterally the proper palmar digital nerves and vessels. ","opEn":"Insert superficially 0.1 cun, or prick with a fine needle to bleed.","noteEn":"Commonly used to promote lactation."},"SI3":{"en":"Back Ravine","locEn":"On the medial side of the hand, proximal to the 5th MCP joint on the ulnar side at the border of the red and white flesh in the depression.","actsEn":"Stiff neck, lower back pain, deafness, manic-depressive psychosis, malaria.","specEn":"Shu-Stream point; Confluent point (opening to the Du / Governing Vessel)","anat":"皮肤→皮下组织→小指展肌与第5掌骨头之间。浅层为尺神经手背支；深层有掌背动脉与小指展肌肌支。","anatEn":"Skin → subcutaneous tissue → between abductor digiti minimi and the head of the 5th metacarpal. Superficially the dorsal branch of the ulnar nerve; deeply the dorsal metacarpal artery and muscular branches to abductor digiti minimi.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"As the saying goes, \"for neck problems seek Houxi\"; a key point for stiff neck and cervicoshoulder syndrome."},"SI6":{"en":"Nourishing the Old","locEn":"In the posterior antebrachial region, 1 cun above the dorsal wrist crease, the head of the ulna in the radial depression.","actsEn":"Lumbago.","specEn":"Xi-Cleft point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂后皮神经、尺神经手背支（C8~T1）；血管：贵要静脉、尺动脉分支。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly or obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Locate and needle with the palm facing the chest."},"SI7":{"en":"Branch to the Correct","locEn":"In the posterior antebrachial region, 5 cun above the distal dorsal wrist crease, between the ulnar border of the ulna and the tendon of m. flexor carpi ulnaris.","actsEn":"Headache, stiff neck, manic-depressive psychosis.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂后皮神经、尺神经手背支（C8~T1）；血管：贵要静脉、尺动脉分支。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Reported to be effective for common warts."},"SI8":{"en":"Small Sea","locEn":"In the posterior cubital region, between the olecranon of the ulna and the medial epicondyle of the humerus in the depression.","actsEn":"Epilepsy, headache, tinnitus.","specEn":"He-Sea point (Earth)","anat":"皮肤→皮下组织→肘关节周围肌腱。神经血管：臂后皮神经、尺神经手背支（C8~T1）；血管：贵要静脉、尺动脉分支。","anatEn":"Skin → subcutaneous tissue → tendons around the elbow joint. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"An electric-shock sensation may radiate to the fingers during needling."},"SI9":{"en":"True Shoulder","locEn":"In the scapular region, the shoulder joint posteroinferior, 1 cun directly above the end of the posterior axillary fold.","actsEn":"Motor impairment of the upper limb, scrofula.","specEn":"Hand Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→三角肌/斜方肌→肩关节囊周围。神经血管：臂后皮神经、尺神经手背支（C8~T1）；血管：贵要静脉、尺动脉分支。","anatEn":"Skin → subcutaneous tissue → deltoid / trapezius → around the capsule of the shoulder joint. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Commonly used for frozen shoulder."},"SI11":{"en":"Middle Shoulder Shu","locEn":"In the scapular region, the spine of the scapula the midpoint and the inferior angle of the scapula the connecting line the upper 1/3 and the lower 2/3intersection in the depression.","actsEn":"Wheezing and dyspnea, mastitis.","specEn":"Hand Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌→肋间肌（或横突棘肌）。神经血管：臂后皮神经、尺神经手背支（C8~T1）；血管：贵要静脉、尺动脉分支。","anatEn":"Skin → subcutaneous tissue → trapezius / latissimus dorsi → erector spinae → intercostal muscles (or transversospinalis). ","opEn":"Insert perpendicularly or obliquely 0.5-1 cun. Moxibustion is applicable.","noteEn":"Pressing and kneading work well for strain of the neck and shoulder."},"SI18":{"en":"Cheek Bone Crevice","locEn":"On the face, on the lower border of the zygomatic bone, directly below the outer canthus of the eye in the depression.","actsEn":"Deviation of the mouth and eye, twitching eyelids, toothache.","specEn":"Hand Taiyang, meeting point of the Hand Shaoyang and Foot Shaoyang Meridians","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：耳颞神经、面神经分支；血管：颞浅动静脉、耳后动静脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Commonly used for facial paralysis and trigeminal neuralgia."},"SI19":{"en":"Auditory Palace","locEn":"On the face, in the depression between the middle of the tragus and the condylar process of the mandible.","actsEn":"Tinnitus, deafness, purulent ear discharge, toothache, manic-depressive psychosis.","specEn":"Hand Taiyang, meeting point of the Hand Shaoyang and Foot Shaoyang Meridians","anat":"皮肤→皮下组织→腮腺与颞下颌关节之间。浅层有耳颞神经、面神经颧支；深层为颞浅动静脉。须张口取穴。","anatEn":"Skin → subcutaneous tissue → between the parotid gland and the temporomandibular joint. Superficially the auriculotemporal nerve and zygomatic branches of the facial nerve; deeply the superficial temporal vessels. Needle with the mouth open.","opEn":"With the mouth open, insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Locate with the mouth open."},"PC1":{"en":"Heavenly Pool","locEn":"On the chest, the 4th intercostal space, 5 cun lateral to the anterior midline.","actsEn":"Cardiac pain, chest oppression, cough, wheezing and dyspnea, mastitis, scrofula.","specEn":"Hand Jueyin, Foot Shaoyang crossing (meeting) point","anat":"皮肤→皮下组织→胸大肌（或胸小肌）→肋间外肌、肋间内肌。神经血管：前臂内侧皮神经（C5~T1）、正中神经；血管：正中动静脉、掌心动脉。","anatEn":"Skin → subcutaneous tissue → pectoralis major (or minor) → external and internal intercostal muscles. ","opEn":"Insert obliquely or transversely 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the heart and lung."},"PC3":{"en":"Marsh at the Bend","locEn":"In the anterior cubital region, on the cubital crease, in the depression on the ulnar side of the tendon of m. biceps brachii.","actsEn":"Cardiac pain, palpitations, stomachache, vomiting, contracture and pain of the elbow and arm.","specEn":"He-Sea point (Water)","anat":"皮肤→皮下组织→肘关节周围肌腱。神经血管：前臂内侧皮神经（C5~T1）、正中神经；血管：正中动静脉、掌心动脉。","anatEn":"Skin → subcutaneous tissue → tendons around the elbow joint. ","opEn":"Insert perpendicularly 0.8-1 cun, or prick with a fine needle to bleed.","noteEn":""},"PC4":{"en":"Cleft Gate","locEn":"In the anterior antebrachial region, 5 cun above the distal palmar wrist crease, between the tendons of m. palmaris longus and m. flexor carpi radialis.","actsEn":"Cardiac pain, palpitations, chest pain, hemoptysis, boils, epilepsy.","specEn":"Xi-Cleft point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：前臂内侧皮神经（C5~T1）、正中神经；血管：正中动静脉、掌心动脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Pressing and kneading are commonly used during angina pectoris attacks."},"PC5":{"en":"Intermediary Courier","locEn":"In the anterior antebrachial region, 3 cun above the distal palmar wrist crease, between the tendons of m. palmaris longus and m. flexor carpi radialis.","actsEn":"Cardiac pain, palpitations, stomachache, vomiting, malaria, manic-depressive psychosis.","specEn":"Jing-River point (Metal)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：前臂内侧皮神经（C5~T1）、正中神经；血管：正中动静脉、掌心动脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":""},"PC6":{"en":"Inner Pass","locEn":"In the anterior antebrachial region, 2 cun above the distal palmar wrist crease, between the tendons of m. palmaris longus and m. flexor carpi radialis.","actsEn":"Cardiac pain, palpitations, chest oppression, stomachache, vomiting, hiccups, dizziness, insomnia, manic-depressive psychosis.","specEn":"Luo-Connecting point; Confluent point (opening to the Yin Link Vessel)","anat":"皮肤→皮下组织→桡侧腕屈肌腱与掌长肌腱之间→指浅屈肌→指深屈肌→旋前方肌。浅层有前臂内侧皮神经；深层为正中神经与正中动脉。内关透外关可对前臂骨间膜双侧刺激。","anatEn":"Skin → subcutaneous tissue → between flexor carpi radialis and palmaris longus tendons → flexor digitorum superficialis → profundus → pronator quadratus. Superficially the medial antebrachial cutaneous nerve; deeply the median nerve and artery. Through-to-TE5 needling stimulates both sides of the interosseous membrane.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"As the saying goes, \"Neiguan for chest, heart and stomach\"; a key point for relieving vomiting and chest oppression."},"PC7":{"en":"Great Mound","locEn":"In the anterior wrist region, at the middle of the distal palmar wrist crease, between the tendons of m. palmaris longus and m. flexor carpi radialis.","actsEn":"Cardiac pain, palpitations, stomachache, vomiting, manic-depressive psychosis, halitosis, arthralgia.","specEn":"Shu-Stream point; Yuan-Source point","anat":"皮肤→皮下组织→腕横韧带/腕背侧支持带及肌腱之间。神经血管：前臂内侧皮神经（C5~T1）、正中神经；血管：正中动静脉、掌心动脉。","anatEn":"Skin → subcutaneous tissue → flexor/dorsal retinaculum and between tendons of the wrist. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"PC8":{"en":"Palace of Weariness","locEn":"In the palmar region, at the level of, proximal to the 3rd metacarpophalangeal joint, between the 2nd and 3rd metacarpal bones, closer to the 3rd metacarpal bone.","actsEn":"Cardiac pain, vexation, vomiting, halitosis, heatstroke.","specEn":"Ying-Spring point (Fire)","anat":"皮肤→皮下组织→掌腱膜→指浅、深屈肌腱之间→第2、3蚓状肌。浅层为正中神经掌支；深层为掌浅弓分支与正中神经指掌侧总神经。","anatEn":"Skin → subcutaneous tissue → palmar aponeurosis → between the tendons of flexor digitorum superficialis and profundus → 2nd–3rd lumbricals. Superficially the palmar branch of the median nerve; deeply branches of the superficial palmar arch and common palmar digital nerves.","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"With the fist clenched, it lies right beneath the tip of the middle finger."},"PC9":{"en":"Middle Rushing","locEn":"On the finger, the middle finger the distal end the highest point.","actsEn":"Heatstroke, coma, cardiac pain, infantile convulsion, stiff tongue.","specEn":"Jing-Well point (Wood)","anat":"皮肤→皮下组织→指骨骨膜；两侧为指掌侧固有神经、血管。神经血管：前臂内侧皮神经（C5~T1）、正中神经；血管：正中动静脉、掌心动脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx; bilaterally the proper palmar digital nerves and vessels. ","opEn":"Insert superficially 0.1 cun, or prick with a fine needle to bleed.","noteEn":"A key first-aid point."},"TE1":{"en":"Rush-Borne Pass","locEn":"On the finger, the 4th finger on the ulnar side of the distal phalanx, 0.1 cun lateral to the corner of the nail root.","actsEn":"Headache, sore and swollen throat.","specEn":"Jing-Well point (Metal)","anat":"皮肤→皮下组织→指骨骨膜；两侧为指掌侧固有神经、血管。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx; bilaterally the proper palmar digital nerves and vessels. ","opEn":"Insert superficially 0.1 cun, or prick with a fine needle to bleed.","noteEn":""},"TE3":{"en":"Central Islet","locEn":"On the dorsum of the hand, between the 4th and 5th metacarpal bones, proximal to the 4th metacarpophalangeal joint in the depression.","actsEn":"Headache, tinnitus, sore and swollen throat, shoulder and back pain.","specEn":"Shu-Stream point (Wood)","anat":"皮肤→皮下组织→手背筋膜→骨间背侧肌。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → dorsal fascia of the hand → dorsal interossei. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"TE4":{"en":"Yang Pool","locEn":"In the posterior wrist region, on the distal dorsal wrist crease, in the depression ulnar to the tendon of m. extensor digitorum.","actsEn":"Red, swollen and painful eyes, deafness, sore and swollen throat, wrist pain, wasting-thirst disorder (diabetes-like), malaria.","specEn":"Yuan-Source point","anat":"皮肤→皮下组织→腕横韧带/腕背侧支持带及肌腱之间。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → flexor/dorsal retinaculum and between tendons of the wrist. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"TE5":{"en":"Outer Pass","locEn":"In the posterior antebrachial region, 2 cun above the distal dorsal wrist crease, midway between the ulna and radius.","actsEn":"Headache, tinnitus, painful obstruction of the upper limb, stiff neck (after sleeping).","specEn":"Luo-Connecting point; Confluent point (opening to the Yang Link Vessel)","anat":"皮肤→皮下组织→小指伸肌与指伸肌之间→拇长伸肌与食指伸肌之间。浅层有前臂后皮神经；深层为骨间后神经、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → between extensor digiti minimi and extensor digitorum → between extensor pollicis longus and extensor indicis. Superficially the posterior antebrachial cutaneous nerve; deeply the posterior interosseous nerve and vessels.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Commonly used for releasing the exterior and reducing fever; it faces Neiguan (PC6)."},"TE6":{"en":"Branch Ditch","locEn":"In the posterior antebrachial region, 3 cun above the distal dorsal wrist crease, midway between the ulna and radius.","actsEn":"Constipation, tinnitus, sudden hoarseness/loss of voice, scrofula.","specEn":"Jing-River point (Fire)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"An empirically effective point for constipation."},"TE10":{"en":"Celestial Well","locEn":"In the posterior cubital region, 1 cun above the tip of the elbow (olecranon) in the depression.","actsEn":"Migraine (one-sided headache), deafness, scrofula, arm pain, epilepsy.","specEn":"He-Sea point (Earth)","anat":"皮肤→皮下组织→肘关节周围肌腱。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → tendons around the elbow joint. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":""},"TE13":{"en":"Upper Arm Meeting","locEn":"In the posterior brachial region, 3 cun below the acromial angle, on the posterior border of m. deltoideus.","actsEn":"Scrofula, goiter.","specEn":"Hand Shaoyang, the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→肱二头肌/肱三头肌。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → biceps brachii / triceps brachii. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":""},"TE14":{"en":"Shoulder Bone Hole","locEn":"In the deltoid region, the acromial angle and the greater tubercle of the humerus in the depression between the two bones.","actsEn":"Motor impairment of the upper limb.","specEn":"Hand Shaoyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→三角肌/斜方肌→肩关节囊周围。神经血管：臂后皮神经、前臂后皮神经（C5~T1）、桡神经/骨间后神经；血管：头静脉、骨间后动静脉。","anatEn":"Skin → subcutaneous tissue → deltoid / trapezius → around the capsule of the shoulder joint. ","opEn":"Insert perpendicularly 0.8-1.2 cun. Moxibustion is applicable.","noteEn":"Combined with Jianyu (LI15) to treat frozen shoulder."},"TE17":{"en":"Wind Screen","locEn":"In the cervical region, posterior to the ear lobe, in the depression anterior to the lower end of the mastoid process.","actsEn":"Tinnitus, deafness, deviation of the mouth and eye, trismus (locked jaw), swelling of the cheek, scrofula.","specEn":"Hand Shaoyang, Foot Shaoyang crossing (meeting) point","anat":"皮肤→皮下组织→腮腺后缘与乳突前缘之间→茎乳孔投影区。浅层有耳大神经后支；深层为面神经干出颅处、枕动脉。","anatEn":"Skin → subcutaneous tissue → between the posterior border of the parotid gland and the anterior border of the mastoid → projection of the stylomastoid foramen. Superficially the posterior branch of the great auricular nerve; deeply the facial nerve trunk at its exit and the occipital artery.","opEn":"Insert perpendicularly 0.8-1.2 cun. Moxibustion is applicable.","noteEn":"A key point for facial paralysis."},"TE20":{"en":"Corner Horn","locEn":"On the head, at the hairline directly above the apex of the ear.","actsEn":"Migraine (one-sided headache), red, swollen and painful eyes, toothache, swelling of the cheek.","specEn":"Hand Shaoyang, Foot Shaoyang, Hand Taiyang crossing (meeting) point","anat":"皮肤→皮下组织→帽状腱膜及颅骨外膜。神经血管：枕小神经、耳大神经、耳颞神经；血管：耳后动静脉、颞浅动静脉。","anatEn":"Skin → subcutaneous tissue → galea aponeurotica and pericranium. ","opEn":"Insert transversely 0.3-0.5 cun. Moxibustion is applicable.","noteEn":"Rush-pith (dengxincao) moxibustion is commonly used for mumps."},"TE21":{"en":"Ear Gate","locEn":"In the ear region, in the depression between the supratragic notch and the condylar process of the mandible.","actsEn":"Tinnitus, deafness, purulent ear discharge, toothache.","specEn":"Hand Shaoyang, Foot Shaoyang, Hand Taiyang crossing (meeting) point","anat":"皮肤→皮下组织→耳软骨前/后缘结缔组织。神经血管：耳颞神经、面神经颧支、颞支；血管：颞浅动静脉。","anatEn":"Skin → subcutaneous tissue → connective tissue at the anterior/posterior border of the auricular cartilage. ","opEn":"With the mouth open, insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Locate with the mouth open."},"TE23":{"en":"Silk Bamboo Space","locEn":"On the face, the lateral end of the eyebrow in the depression.","actsEn":"Headache, red, swollen and painful eyes, twitching eyelids, toothache, manic-depressive psychosis.","specEn":"Hand Shaoyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：耳颞神经、面神经颧支、颞支；血管：颞浅动静脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert transversely 0.3-0.5 cun.","noteEn":"Moxibustion is prohibited."},"ST1":{"en":"Tear Container","locEn":"On the face, between the eyeball and the orbit the lower border, directly below the pupil.","actsEn":"Red, swollen and painful eyes, lacrimation induced by wind, night blindness, twitching eyelids, deviation of the mouth and eye.","specEn":"Foot Yangming, the Yang Heel Vessel, the Conception Vessel (Ren) crossing (meeting) point","anat":"皮肤→皮下组织→眼轮匝肌→眶下缘骨膜。浅层为眶下神经分支、面神经颧支；深层贴近眼球下壁，禁提插捻转以防损伤。","anatEn":"Skin → subcutaneous tissue → orbicularis oculi → periosteum of the infraorbital margin. Superficially the infraorbital nerve and zygomatic branch of the facial nerve; deeply close to the inferior wall of the eyeball — no lifting/thrusting or rotation to avoid injury.","opEn":"Gently push the eyeball upward with the left thumb and insert perpendicularly 0.3-0.7 cun close to the infraorbital border. Moxibustion is not suitable.","noteEn":"Insert slowly; lifting and thrusting are not advised; press after withdrawal to prevent bleeding."},"ST2":{"en":"Four Whites","locEn":"On the face, at the infraorbital foramen.","actsEn":"Corneal opacity, twitching eyelids, deviation of the mouth and eye, headache.","specEn":"Foot Yangming Jing-River point (non-special point)","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：三叉神经第2、3支（上颌神经、下颌神经）及面神经颧支；血管：面动静脉、眶下动静脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is not suitable.","noteEn":"Do not insert deeply."},"ST4":{"en":"Earth Granary","locEn":"On the face, 0.4 cun lateral to the corner of the mouth.","actsEn":"Deviation of the mouth and eye, drooling, toothache.","specEn":"Hand and FootYangming, the Yang Heel Vessel (Yangqiao) crossing (meeting) point","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：三叉神经第2、3支（上颌神经、下颌神经）及面神经颧支；血管：面动静脉、眶下动静脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert obliquely or transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"For facial paralysis, often inserted through to Jiache (ST6)."},"ST6":{"en":"Jaw Bone","locEn":"On the face, anterosuperior to the angle of the mandible one finger-breadth (the middle finger), on the prominence of m. masseter.","actsEn":"Trismus (locked jaw), toothache, swelling of the cheek, deviation of the mouth and eye, facial swelling.","specEn":"Foot Yangming Jing-River point (non-special point)","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：三叉神经第2、3支（上颌神经、下颌神经）及面神经颧支；血管：面动静脉、眶下动静脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Perpendicular insertion 0.3-0.5 cun, or transverse insertion through to Dicang (ST4). Moxibustion is applicable.","noteEn":"It is the highest point of the bulging masseter when the teeth are clenched."},"ST7":{"en":"Below the Joint","locEn":"On the face, between at the middle of the lower border of the zygomatic arch and the mandibular notch in the depression.","actsEn":"Toothache, tinnitus, deviation of the mouth and eye.","specEn":"Foot Yangming, Foot Shaoyang crossing (meeting) point","anat":"皮肤→皮下组织→腮腺与咬肌之间→颞下颌关节囊。浅层有耳颞神经、面神经颧支与下颌缘支；深层为上颌动静脉、翼静脉丛。","anatEn":"Skin → subcutaneous tissue → between the parotid gland and masseter → capsule of the temporomandibular joint. Superficially the auriculotemporal nerve, zygomatic and marginal mandibular branches of the facial nerve; deeply the maxillary artery and pterygoid venous plexus.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Locate with the mouth closed."},"ST8":{"en":"Head Corner","locEn":"On the head, 0.5 cun directly above the hairline at the frontal angle, 4.5 cun lateral to the anterior midline.","actsEn":"Migraine (one-sided headache), eye pain, lacrimation induced by wind, twitching eyelids.","specEn":"Foot Yangming, Foot Shaoyang, the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→帽状腱膜及颅骨外膜。","anatEn":"Skin → subcutaneous tissue → galea aponeurotica and pericranium. ","opEn":"Insert transversely 0.5-1 cun. Moxibustion is not suitable.","noteEn":""},"ST21":{"en":"Liang Gate","locEn":"In the upper abdomen, 4 cun above the center of the umbilicus, 2 cun lateral to the anterior midline.","actsEn":"Stomachache, vomiting, poor appetite, abdominal distension, diarrhea.","specEn":"Foot Yangming Jing-River point (non-special point)","anat":"皮肤→皮下组织→腹直肌鞘与腹直肌（或腹外斜肌、腹内斜肌、腹横肌）→腹横筋膜→腹膜。神经血管：胸神经前支（T7~L1）、髂腹下神经；血管：腹壁上/下动静脉。","anatEn":"Skin → subcutaneous tissue → rectus sheath and rectus abdominis (or obliquus externus/internus/transversus abdominis) → transversalis fascia → peritoneum. ","opEn":"Insert perpendicularly 0.8-1.2 cun. Moxibustion is applicable.","noteEn":""},"ST25":{"en":"Celestial Pivot","locEn":"On the abdomen, level with the center of the umbilicus, 2 cun lateral to the anterior midline.","actsEn":"Abdominal pain, abdominal distension, constipation, diarrhea, dysentery, irregular menstruation, dysmenorrhea.","specEn":"Front-Mu point of the Large Intestine","anat":"皮肤→皮下组织→腹直肌鞘→腹直肌。浅层有第10肋间神经前皮支及腹壁浅静脉；深层为第10肋间神经、腹壁下动静脉。腹腔内正对小肠。","anatEn":"Skin → subcutaneous tissue → rectus sheath → rectus abdominis. Superficially the anterior cutaneous branch of the 10th intercostal nerve and superficial epigastric vein; deeply the 10th intercostal nerve and inferior epigastric vessels. Small intestine directly beneath.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"A main point for gastrointestinal disorders; use with caution in pregnancy."},"ST34":{"en":"Ridge Mound","locEn":"In the anterior femoral region, 2 cun above the base of the patella, between m. vastus lateralis and the tendon of m. rectus femoris.","actsEn":"Stomachache, swelling and pain of the knee, motor impairment of the lower limb, mastitis.","specEn":"Xi-Cleft point","anat":"皮肤→皮下组织→大腿前/后群肌。神经血管：股神经前皮支（L2~L4）、股外侧皮神经、腓总神经；血管：股动静脉、胫前动静脉。","anatEn":"Skin → subcutaneous tissue → anterior/posterior thigh muscle groups. ","opEn":"Insert perpendicularly 1-1.2 cun. Moxibustion is applicable.","noteEn":"Pressing and kneading work well for acute stomachache from gastric spasm."},"ST36":{"en":"Leg Three Li","locEn":"On the lateral side of the lower leg, 3 cun below ST35 (Dubi), one finger-breadth (the middle finger) lateral to the anterior crest of the tibia.","actsEn":"Stomachache, abdominal distension, vomiting, diarrhea, constipation, indigestion, weakness and paralysis of the lower limbs, consumptive disease, insomnia, dizziness.","specEn":"He-Sea point (Earth);Lower He-Sea point of the Stomach; one of the Four Command points; major tonification point","anat":"皮肤→皮下组织→胫骨前肌→趾长伸肌→小腿骨间膜。浅层布有腓肠外侧皮神经；深层为腓深神经与胫前动静脉。此区肌腹丰厚，是电针与运动点刺激的经典部位。","anatEn":"Skin → subcutaneous tissue → tibialis anterior → extensor digitorum longus → interosseous membrane. Superficially the lateral sural cutaneous nerve; deeply the deep peroneal nerve and anterior tibial vessels. Thick muscle bellies here make it a classic site for electroacupuncture and motor-point stimulation.","opEn":"Insert perpendicularly 1-2 cun. Moxibustion is applicable.","noteEn":"As the saying goes, \"for abdominal problems stay at Sanli\"; a commonly used point for health-preserving moxibustion."},"ST37":{"en":"Upper Great Void","locEn":"On the lateral side of the lower leg, 6 cun below ST35 (Dubi), on the line connecting ST35 (Dubi) and ST41 (Jiexi).","actsEn":"Borborygmus, abdominal pain, diarrhea, constipation, intestinal abscess (appendicitis), weakness and paralysis of the lower limbs.","specEn":"Lower He-Sea point of the Large Intestine","anat":"皮肤→皮下组织→小腿肌群。神经血管：股神经前皮支（L2~L4）、股外侧皮神经、腓总神经；血管：股动静脉、胫前动静脉。","anatEn":"Skin → subcutaneous tissue → crural muscle groups. ","opEn":"Insert perpendicularly 1-2 cun. Moxibustion is applicable.","noteEn":"A key point for intestinal disorders."},"ST38":{"en":"Trench Mouth","locEn":"On the lateral side of the lower leg, 8 cun below ST35 (Dubi), on the line connecting ST35 (Dubi) and ST41 (Jiexi).","actsEn":"Weakness and paralysis of the lower limbs, muscle cramps, arm pain.","specEn":"Foot Yangming Jing-River point (non-special point)","anat":"皮肤→皮下组织→小腿肌群。神经血管：股神经前皮支（L2~L4）、股外侧皮神经、腓总神经；血管：股动静脉、胫前动静脉。","anatEn":"Skin → subcutaneous tissue → crural muscle groups. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Inserting through to Chengshan (BL57) can treat frozen shoulder (Tiaokou-Chengshan method)."},"ST40":{"en":"Abundant Bulge","locEn":"On the lateral side of the lower leg, 8 cun above the tip of the lateral malleolus, on the outer border of m. tibialis anterior.","actsEn":"Cough, asthma, headache, dizziness, manic-depressive psychosis, weakness and paralysis of the lower limbs.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→趾长伸肌与拇长伸肌之间→小腿骨间膜后即胫骨后肌。浅层有腓肠外侧皮神经；深层为腓深神经与胫前动静脉。","anatEn":"Skin → subcutaneous tissue → between extensor digitorum longus and extensor hallucis longus → posterior to the interosseous membrane lies tibialis posterior. Superficially the lateral sural cutaneous nerve; deeply the deep peroneal nerve and anterior tibial vessels.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"A key point for resolving phlegm."},"ST41":{"en":"Ravine Divide","locEn":"In the malleolar region, at the center of the anterior aspect of the ankle joint in the depression, between the tendons of m. extensor pollicis longus and m. extensor digitorum longus.","actsEn":"Headache, dizziness, manic-depressive psychosis, abdominal distension, constipation, weakness and paralysis of the lower limbs, arthralgia.","specEn":"Jing-River point (Fire)","anat":"皮肤→皮下组织→拇长伸肌腱与趾长伸肌腱之间→踝关节囊前壁。浅层有足背内侧皮神经与腓浅神经；深层为足背动静脉（在此处可触及搏动）。","anatEn":"Skin → subcutaneous tissue → between the tendons of extensor hallucis longus and extensor digitorum longus → anterior capsule of the ankle joint. Superficially the medial dorsal cutaneous and superficial peroneal nerves; deeply the dorsal artery and vein of the foot (palpable here).","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"ST44":{"en":"Inner Court","locEn":"On the dorsum of the foot, between the 2nd and 3rd toes, proximal to the web margin of the toes at the border of the red and white flesh.","actsEn":"Toothache, sore and swollen throat, nosebleed, stomachache, abdominal distension, constipation.","specEn":"Ying-Spring point (Water)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：腓浅、腓深神经（L4~S1）；血管：足背动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly or obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Key point for clearing stomach heat; used for toothache."},"ST45":{"en":"Strict Exchange","locEn":"On the toe, the 2nd toe on the lateral side of the distal phalanx, 0.1 cun posterior-lateral to the corner of the toenail root.","actsEn":"Toothache, sore and swollen throat, nosebleed, excessive dreaming, manic-depressive psychosis.","specEn":"Jing-Well point (Metal)","anat":"皮肤→皮下组织→趾骨骨膜。神经血管：腓浅、腓深神经（L4~S1）；血管：足背动静脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx. ","opEn":"Insert superficially 0.1 cun. Moxibustion is applicable.","noteEn":""},"BL1":{"en":"Bright Eyes","locEn":"On the face, superior and medial to in the depression on the medial wall of the orbit at the inner canthus of the eye.","actsEn":"Red, swollen and painful eyes, lacrimation induced by wind, myopia, night blindness, acute lumbar sprain.","specEn":"Hand and FootTaiyang, Foot Yangming, the Yin Heel Vessel (Yangqiao) crossing (meeting) point","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。神经血管：滑车上神经（三叉神经第1支）；血管：内眦动静脉。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Ask the patient to close the eyes; gently push the eyeball laterally with the left hand for fixation, then slowly insert perpendicularly 0.5-1.0 cun close to the orbital rim. Moxibustion is not suitable.","noteEn":"Lifting, thrusting and twisting are prohibited; press after withdrawal to prevent bleeding. This is a high-risk point for needling accidents — use with great caution."},"BL2":{"en":"Bamboo Gathering","locEn":"On the face, in the depression at the medial end of the eyebrow, at the supratrochlear notch.","actsEn":"Headache, bone pain, red, swollen and painful eyes, twitching eyelids, hiccups.","specEn":"Foot Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→额肌与皱眉肌之间。浅层有滑车上神经与额动静脉分支；深层为眶上切迹内的眶上神经、血管。","anatEn":"Skin → subcutaneous tissue → between frontalis and corrugator supercilii. Superficially the supratrochlear nerve and frontal vessels; deeply the supraorbital neurovascular bundle at the supraorbital notch.","opEn":"Insert transversely 0.5-0.8 cun. Moxibustion is not suitable.","noteEn":"Finger pressure on Zanzhu (BL2) is effective for stopping hiccups."},"BL10":{"en":"Pillar of Heaven","locEn":"In the posterior cervical region, level with the below the upper border of the 2nd cervical vertebra, in the depression on the lateral border of m. trapezius.","actsEn":"Stiff neck, shoulder and back pain, headache, dizziness, red, swollen and painful eyes, nasal congestion.","specEn":"Foot Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→斜方肌与头夹肌之间。浅层有枕大神经、枕动静脉分支；深层近寰枕关节与椎动脉，不可深刺。","anatEn":"Skin → subcutaneous tissue → between trapezius and splenius capitis. Superficially the greater occipital nerve and occipital vessels; deeply near the atlanto-occipital joint and vertebral artery — deep needling prohibited.","opEn":"Insert perpendicularly or obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply upward and inward, to avoid injuring the medulla oblongata."},"BL11":{"en":"Great Shuttle","locEn":"In the spinal region, below the spinous process of the 1st thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Cough, fever, stiff neck, shoulder and back pain.","specEn":"Meeting point of bones; meeting point of the Hand Taiyang and Foot Taiyang Meridians","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第1胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T1; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised, to avoid injuring the lung."},"BL12":{"en":"Wind Gate","locEn":"In the spinal region, below the spinous process of the 2nd thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Cough, headache, stiff neck, back pain.","specEn":"Foot Taiyang, the Governing Vessel (Du) crossing (meeting) point","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第2胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T2; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Commonly used at the early stage of the common cold."},"BL13":{"en":"Lung Shu","locEn":"In the spinal region, below the spinous process of the 3rd thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Cough, wheezing and dyspnea, hemoptysis, tidal fever, night sweats, nasal congestion.","specEn":"Back-Shu point of the Lung","anat":"皮肤→皮下组织→斜方肌→菱形肌→竖脊肌。浅层有第3胸神经后支内侧皮支；深层为第3胸神经后支肌支、肋间后动脉背侧支。内侧斜刺以避胸腔。","anatEn":"Skin → subcutaneous tissue → trapezius → rhomboid → erector spinae. Superficially the medial cutaneous branch of the 3rd thoracic posterior ramus; deeply its muscular branch and the dorsal branch of the 3rd posterior intercostal artery. Oblique needling to avoid the pleural cavity.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL15":{"en":"Heart Shu","locEn":"In the spinal region, below the spinous process of the 5th thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Cardiac pain, palpitations, insomnia, poor memory, night sweats, manic-depressive psychosis.","specEn":"Back-Shu point of the Heart","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第5胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T5; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL17":{"en":"Diaphragm Shu","locEn":"In the spinal region, below the spinous process of the 7th thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Vomiting, hiccups, wheezing and dyspnea, cough, anemia, night sweats.","specEn":"Meeting point of blood","anat":"皮肤→皮下组织→斜方肌→竖脊肌。浅层有第7胸神经后支内侧皮支；深层为肋间后动静脉背侧支。平第7胸椎，膈肌投影水平，禁直刺过深。","anatEn":"Skin → subcutaneous tissue → trapezius → erector spinae. Superficially the medial cutaneous branch of the 7th thoracic posterior ramus; deeply the dorsal branch of the 7th posterior intercostal vessels. Level with T7 at the projection of the diaphragm — avoid deep perpendicular needling.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"A key point for bleeding disorders."},"BL18":{"en":"Liver Shu","locEn":"In the spinal region, below the spinous process of the 9th thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Hypochondriac pain, jaundice, dizziness, manic-depressive psychosis.","specEn":"Back-Shu point of the Liver","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第9胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T9; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL19":{"en":"Gallbladder Shu","locEn":"In the spinal region, below the spinous process of the 10th thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Jaundice, hypochondriac pain, pulmonary tuberculosis, tidal fever.","specEn":"Back-Shu point of the Gallbladder","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第10胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T10; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL20":{"en":"Spleen Shu","locEn":"In the spinal region, below the spinous process of the 11th thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Abdominal distension, vomiting, diarrhea, dysentery, edema, jaundice, back pain.","specEn":"Back-Shu point of the Spleen","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第11胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T11; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL21":{"en":"Stomach Shu","locEn":"In the spinal region, below the spinous process of the 12th thoracic vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Epigastric pain, vomiting, abdominal distension, borborygmus.","specEn":"Back-Shu point of the Stomach","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第12胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T12; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL23":{"en":"Kidney Shu","locEn":"In the spinal region, below the spinous process of the 2nd lumbar vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Enuresis, nocturnal emission, impotence, irregular menstruation, leukorrhea, lumbago, tinnitus, edema, wheezing and dyspnea.","specEn":"Back-Shu point of the Kidney","anat":"皮肤→皮下组织→胸腰筋膜→竖脊肌。浅层有第2腰神经后支内侧皮支；深层为第2腰神经后支外侧支、腰动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → thoracolumbar fascia → erector spinae. Superficially the medial cutaneous branch of the 2nd lumbar posterior ramus; deeply the lateral branch of the 2nd lumbar posterior ramus and dorsal branches of the lumbar vessels.","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"A commonly used point for health-preserving moxibustion; gentle moxibustion is preferred."},"BL25":{"en":"Large Intestine Shu","locEn":"In the spinal region, below the spinous process of the 4th lumbar vertebra, 1.5 cun lateral to the posterior midline.","actsEn":"Lumbago, abdominal distension, diarrhea, constipation, dysentery, lumbar and leg pain.","specEn":"Back-Shu point of the Large Intestine","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第4腰神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of L4; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert perpendicularly 0.8-1.2 cun. Moxibustion is applicable.","noteEn":"Approximately level with the iliac crest."},"BL32":{"en":"Second Bone Hole","locEn":"In the sacral region, level with the 2nd posterior sacral foramen.","actsEn":"Irregular menstruation, dysmenorrhea, leukorrhea, nocturnal emission, impotence, difficult urination, lumbosacral pain, weakness and paralysis of the lower limbs.","specEn":"Foot Taiyang Jing-River point (non-special point); one of the eight liao points","anat":"皮肤→皮下组织→臀大肌起始部→骶棘肌。正对第2骶后孔，浅层有臀中皮神经；深层为骶2神经后支。是骶管韧带松解与妇科电针常用靶点。","anatEn":"Skin → subcutaneous tissue → origin of gluteus maximus → sacrospinalis. Directly over the 2nd posterior sacral foramen. Superficially the middle cluneal nerves; deeply the posterior ramus of S2. A common target for sacral release and gynecological electroacupuncture.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Commonly used for gynecological diseases and lumbosacral pain."},"BL40":{"en":"Bend Middle","locEn":"In the posterior knee region, at the midpoint of the popliteal crease.","actsEn":"Lower back pain, weakness and paralysis of the lower limbs, abdominal pain, difficult urination, erysipelas.","specEn":"He-Sea point (Earth);Lower He-Sea point of the Bladder; one of the Four Command points","anat":"皮肤→皮下组织→腘窝正中脂肪垫→腘动静脉与胫神经。浅层有股后皮神经；深层为胫神经干。严禁深刺，防伤腘血管。","anatEn":"Skin → subcutaneous tissue → central fat pad of the popliteal fossa → popliteal vessels and tibial nerve. Superficially the posterior femoral cutaneous nerve; deeply the tibial nerve trunk. Deep needling strictly prohibited to protect the popliteal vessels.","opEn":"Perpendicular insertion 1.0-1.5 cun, or prick the popliteal vein to let out a few drops of blood.","noteEn":"As the saying goes, \"for lower back problems seek Weizhong\"; strict disinfection is required for bloodletting."},"BL43":{"en":"Gao Huang Shu","locEn":"In the spinal region, below the spinous process of the 4th thoracic vertebra, 3 cun lateral to the posterior midline.","actsEn":"Pulmonary tuberculosis, cough, wheezing and dyspnea, night sweats, poor memory, nocturnal emission, consumptive disease.","specEn":"Foot Taiyang Jing-River point (non-special point); a key point for consumptive and deficient diseases","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第4胸神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of T4; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"A commonly used health-preserving moxibustion point for deficiency and consumptive diseases."},"BL52":{"en":"Willow Chamber","locEn":"In the lumbar region, below the spinous process of the 2nd lumbar vertebra, 3 cun lateral to the posterior midline.","actsEn":"Nocturnal emission, impotence, difficult urination, edema, stiffness and pain of the lumbar spine.","specEn":"Foot Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第2腰神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of L2; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert obliquely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Deep insertion is not advised."},"BL54":{"en":"Orderly Border","locEn":"In the sacral region, level with the 4th posterior sacral foramen, 3 cun lateral to the sacral median crest.","actsEn":"Lumbosacral pain, weakness and paralysis of the lower limbs, difficult urination, constipation.","specEn":"Foot Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→斜方肌/背阔肌→竖脊肌。浅层有第4骶神经后支内侧皮支；深层为其肌支、肋间后动静脉背侧支。","anatEn":"Skin → subcutaneous tissue → trapezius/latissimus dorsi → erector spinae. Superficially the medial cutaneous branch of the posterior ramus of S4; deeply its muscular branch and the dorsal branch of the posterior intercostal vessels.","opEn":"Insert perpendicularly 1.5-2 cun. Moxibustion is applicable.","noteEn":"A radiating sensation toward the lower limb may occur when inserted deeply."},"BL57":{"en":"Support of the Mountain","locEn":"In the posterior crural region, at the angle where the two bellies of m. gastrocnemius join its tendon.","actsEn":"Muscle cramps, constipation, beriberi.","specEn":"Foot Taiyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→腓肠肌两肌腹交汇处→比目鱼肌。浅层有腓肠内侧皮神经、小隐静脉；深层为胫神经与胫后动静脉。","anatEn":"Skin → subcutaneous tissue → junction of the two bellies of gastrocnemius → soleus. Superficially the medial sural cutaneous nerve and small saphenous vein; deeply the tibial nerve and posterior tibial vessels.","opEn":"Insert perpendicularly 1-2 cun. Moxibustion is applicable.","noteEn":"A key point for calf cramps."},"BL60":{"en":"Kunlun Mountain","locEn":"In the malleolar region, in the depression between the tip of the lateral malleolus and the Achilles tendon.","actsEn":"Headache, stiff neck, epilepsy, difficult labor.","specEn":"Jing-River point (Fire)","anat":"皮肤→皮下组织→腓骨长、短肌腱与跟腱之间。浅层有腓肠神经；深层为腓动静脉跟外侧支。","anatEn":"Skin → subcutaneous tissue → between the tendons of peroneus longus/brevis and the Achilles tendon. Superficially the sural nerve; deeply the lateral calcaneal branches of the peroneal vessels.","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Contraindicated in pregnancy (it may induce labor)."},"BL62":{"en":"Extending Vessel","locEn":"In the malleolar region, directly below the tip of the lateral malleolus, between the lower border of the lateral malleolus and the calcaneus in the depression.","actsEn":"Headache, dizziness, insomnia, manic-depressive psychosis.","specEn":"Confluent point (opening to the Yang Qiao Vessel)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：腓肠神经、足底外侧神经；血管：足底外侧动静脉。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"BL67":{"en":"Reaching Yin","locEn":"On the toe, the little toe on the lateral side of the distal phalanx, 0.1 cun posterior-lateral to the corner of the toenail root.","actsEn":"Malposition of the fetus, difficult labor, headache, eye pain, nasal congestion.","specEn":"Jing-Well point (Metal)","anat":"皮肤→皮下组织→趾骨骨膜。神经血管：腓肠神经、足底外侧神经；血管：足底外侧动静脉。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx. ","opEn":"Superficial insertion 0.1 cun; moxibustion is used for correcting malposition of the fetus.","noteEn":"Moxa-stick gentle moxibustion is often used to correct fetal malposition; it must be performed by qualified professionals."},"GB1":{"en":"Pupil Bone Hole","locEn":"On the face, 0.5 cun lateral to the outer canthus of the eye.","actsEn":"Headache, red, swollen and painful eyes, corneal opacity, optic atrophy, lacrimation induced by wind.","specEn":"Hand Taiyang, meeting point of the Hand Shaoyang and Foot Shaoyang Meridians","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert transversely 0.3-0.5 cun. Moxibustion is not suitable.","noteEn":""},"GB2":{"en":"Meeting of Hearing","locEn":"On the face, in the depression between the intertragic notch and the condylar process of the mandible.","actsEn":"Tinnitus, deafness, purulent ear discharge, toothache, deviation of the mouth and eye.","specEn":"Foot Shaoyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→腮腺与颞下颌关节之间。浅层有耳颞神经与面神经；深层为颞浅动静脉。须张口取穴。","anatEn":"Skin → subcutaneous tissue → between the parotid gland and the temporomandibular joint. Superficially the auriculotemporal and facial nerves; deeply the superficial temporal vessels. Needle with the mouth open.","opEn":"With the mouth open, insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Locate with the mouth open."},"GB14":{"en":"Yang White","locEn":"On the head, 1 cun above the eyebrow, directly above the pupil.","actsEn":"Red, swollen and painful eyes, ptosis, deviation of the mouth and eye.","specEn":"Foot Shaoyang, the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→表情肌/咀嚼肌及骨面。","anatEn":"Skin → subcutaneous tissue → muscles of facial expression / muscles of mastication onto the bone surface. ","opEn":"Insert transversely 0.5-0.8 cun. Moxibustion is not suitable.","noteEn":"Commonly used for ptosis (drooping eyelid)."},"GB20":{"en":"Wind Pool","locEn":"In the posterior cervical region, below the occipital bone, in the depression between the upper ends of m. sternocleidomastoideus and m. trapezius.","actsEn":"Headache, dizziness, red, swollen and painful eyes, nasal congestion, tinnitus, stiffness and pain of the neck, common cold, stroke, insomnia.","specEn":"Foot Shaoyang, the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→斜方肌与胸锁乳突肌之间→头夹肌→头半棘肌。浅层有枕小神经、枕动静脉；深层近寰枕筋膜与椎动脉，针尖方向须朝向鼻尖，不可向上深刺。","anatEn":"Skin → subcutaneous tissue → between trapezius and sternocleidomastoid → splenius capitis → semispinalis capitis. Superficially the lesser occipital nerve and occipital vessels; deeply near the atlanto-occipital membrane and vertebral artery. Needle tip directed toward the nose tip; never needle deeply upward.","opEn":"With the tip angled slightly downward, obliquely insert 0.8-1.2 cun toward the tip of the nose. Moxibustion is applicable.","noteEn":"The medulla oblongata lies deep — do not insert deeply upward."},"GB21":{"en":"Shoulder Well","locEn":"In the scapular region, at the midpoint of the line connecting the spinous process of the 7th cervical vertebra and the most lateral point of the acromion.","actsEn":"Stiffness and pain of the neck, mastitis, failure of lactation, difficult labor.","specEn":"Foot Shaoyang, the Yang Linking Vessel (Yangwei) crossing (meeting) point","anat":"皮肤→皮下组织→斜方肌→肩胛提肌。浅层有锁骨上神经；深层为副神经与颈横动脉降支。深部为肺尖，禁深刺，孕妇禁用。","anatEn":"Skin → subcutaneous tissue → trapezius → levator scapulae. Superficially the supraclavicular nerve; deeply the accessory nerve and descending branch of the transverse cervical artery. The lung apex lies deep — no deep needling; contraindicated in pregnancy.","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Contraindicated in pregnancy; do not insert deeply, to avoid injuring the apex of the lung."},"GB24":{"en":"Sun and Moon","locEn":"On the chest, the 7th intercostal space, 4 cun lateral to the anterior midline.","actsEn":"Vomiting, acid regurgitation, jaundice, hiccups.","specEn":"Front-Mu point of the Gallbladder","anat":"皮肤→皮下组织→腹外斜肌→腹内斜肌→腹横肌。神经血管：第11、12胸神经前支、髂腹下神经；血管：腹壁下动静脉、旋髂深动脉。","anatEn":"Skin → subcutaneous tissue → obliquus externus → obliquus internus → transversus abdominis. ","opEn":"Insert obliquely or transversely 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the liver."},"GB25":{"en":"Capital Gate","locEn":"On the lateral side of the abdomen, below the free end of the 12th rib.","actsEn":"Hypochondriac pain, abdominal distension, borborygmus, diarrhea, difficult urination, edema.","specEn":"Front-Mu point of the Kidney","anat":"皮肤→皮下组织→腹外斜肌→腹内斜肌→腹横肌。神经血管：第11、12胸神经前支、髂腹下神经；血管：腹壁下动静脉、旋髂深动脉。","anatEn":"Skin → subcutaneous tissue → obliquus externus → obliquus internus → transversus abdominis. ","opEn":"Insert perpendicularly 0.5-1 cun. Moxibustion is applicable.","noteEn":"Do not insert deeply, to avoid injuring the kidney."},"GB26":{"en":"Girdling Vessel","locEn":"On the lateral side of the abdomen, at the intersection of the vertical line descending from the free end of the 11th rib and the horizontal line of the umbilicus.","actsEn":"Irregular menstruation, leukorrhea, amenorrhea, abdominal pain, hypochondriac pain.","specEn":"Foot Shaoyang, the Belt Vessel (Dai) crossing (meeting) point","anat":"皮肤→皮下组织→腹直肌鞘与腹直肌（或腹外斜肌、腹内斜肌、腹横肌）→腹横筋膜→腹膜。神经血管：第11、12胸神经前支、髂腹下神经；血管：腹壁下动静脉、旋髂深动脉。","anatEn":"Skin → subcutaneous tissue → rectus sheath and rectus abdominis (or obliquus externus/internus/transversus abdominis) → transversalis fascia → peritoneum. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":""},"GB30":{"en":"Jumping Round","locEn":"In the gluteal region, at the junction of the the lateral 1/3 and the medial 2/3 of the line connecting the most prominent point of the greater trochanter of the femur and the sacral hiatus.","actsEn":"Weakness and paralysis of the lower limbs, hemiplegia, rubella/wheals.","specEn":"Foot Shaoyang, Foot Taiyang crossing (meeting) point","anat":"皮肤→皮下组织→臀大肌→臀中肌→梨状肌下缘与坐骨神经干。浅层有臀上皮神经；深层为臀下动静脉、坐骨神经及其分支。","anatEn":"Skin → subcutaneous tissue → gluteus maximus → gluteus medius → inferior border of piriformis and the sciatic nerve trunk. Superficially the superior cluneal nerves; deeply the inferior gluteal vessels and the sciatic nerve with its branches.","opEn":"Insert perpendicularly 2-3 cun. Moxibustion is applicable.","noteEn":"An electric-shock sensation may radiate down the lower limb when inserted deeply; avoid the trunk of the sciatic nerve."},"GB31":{"en":"Wind Market","locEn":"In the femoral region, when standing upright with arms hanging and palms against the thighs, in the depression where the tip of the middle finger touches.","actsEn":"Weakness and paralysis of the lower limbs, hemiplegia, beriberi.","specEn":"Foot Shaoyang Jing-River point (non-special point)","anat":"皮肤→皮下组织→大腿前/后群肌。神经血管：股外侧皮神经、腓总神经（L4~S1）；血管：旋股外侧动脉降支、胫前动静脉。","anatEn":"Skin → subcutaneous tissue → anterior/posterior thigh muscle groups. ","opEn":"Insert perpendicularly 1-2 cun. Moxibustion is applicable.","noteEn":"Simple locating method: it is where the tip of the middle finger falls when the arms hang naturally."},"GB34":{"en":"Yang Mound Spring","locEn":"On the lateral side of the lower leg, in the depression anteroinferior to the head of the fibula.","actsEn":"Hypochondriac pain, vomiting, jaundice, weakness and paralysis of the lower limbs, swelling and pain of the knee, numbness of the lower limbs.","specEn":"He-Sea point (Earth);Lower He-Sea point of the Gallbladder; Meeting point of sinews","anat":"皮肤→皮下组织→腓骨长肌与趾长伸肌之间。浅层有腓肠外侧皮神经；深层为腓浅神经与胫前动静脉分支。","anatEn":"Skin → subcutaneous tissue → between peroneus longus and extensor digitorum longus. Superficially the lateral sural cutaneous nerve; deeply the superficial peroneal nerve and branches of the anterior tibial vessels.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Meeting point of the sinews (a Hui-meeting point); a key point for sinew disorders and hypochondriac pain."},"GB37":{"en":"Brilliant Light","locEn":"On the lateral side of the lower leg, 5 cun above the tip of the lateral malleolus, on the anterior border of the fibula.","actsEn":"Eye pain, night blindness, weakness and paralysis of the lower limbs.","specEn":"Luo-Connecting point","anat":"皮肤→皮下组织→小腿肌群。神经血管：股外侧皮神经、腓总神经（L4~S1）；血管：旋股外侧动脉降支、胫前动静脉。","anatEn":"Skin → subcutaneous tissue → crural muscle groups. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Commonly used in ophthalmology."},"GB39":{"en":"Suspended Bell","locEn":"On the lateral side of the lower leg, 3 cun above the tip of the lateral malleolus, on the anterior border of the fibula.","actsEn":"Stiff neck, stiff neck (after sleeping), migraine (one-sided headache), sore and swollen throat, weakness and paralysis of the lower limbs, beriberi.","specEn":"Meeting point of marrow","anat":"皮肤→皮下组织→趾长伸肌与腓骨短肌之间。浅层有腓浅神经终支；深层近腓动静脉。髓会（悬钟）在腓骨骨膜处可触得骨传导感。","anatEn":"Skin → subcutaneous tissue → between extensor digitorum longus and peroneus brevis. Superficially the terminal branches of the superficial peroneal nerve; deeply near the peroneal vessels. At the periosteum of the fibula (meeting point of marrow).","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":"Also known as Juegu; used for stiffness and pain of the neck."},"GB40":{"en":"Mound Ruins","locEn":"In the malleolar region, anteroinferior to the lateral malleolus, in the depression on the lateral side of the tendon of m. extensor digitorum longus.","actsEn":"Chest and hypochondriac pain, weakness and paralysis of the lower limbs, malaria.","specEn":"Yuan-Source point","anat":"皮肤→皮下组织→踝关节支持带与肌腱之间。神经血管：股外侧皮神经、腓总神经（L4~S1）；血管：旋股外侧动脉降支、胫前动静脉。","anatEn":"Skin → subcutaneous tissue → between the retinacula and tendons of the ankle. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"GB41":{"en":"Foot Governor of Tears","locEn":"On the dorsum of the foot, in front of the junction of the bases of the 4th and 5th metatarsal bones, in the depression lateral to the tendon of m. extensor digiti minimi.","actsEn":"Migraine (one-sided headache), red, swollen and painful eyes, irregular menstruation, mastitis, swelling and pain of the dorsum of the foot.","specEn":"Shu-Stream point; Confluent point (opening to the Dai Vessel)","anat":"皮肤→皮下组织→第4、5跖骨底之间→骨间背侧肌。浅层有足背中间皮神经；深层为足背动静脉分支与腓深神经终支。","anatEn":"Skin → subcutaneous tissue → between the bases of the 4th and 5th metatarsals → dorsal interossei. Superficially the intermediate dorsal cutaneous nerve; deeply branches of the dorsal artery of the foot and terminal deep peroneal nerve.","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"GB43":{"en":"Pinch Ravine","locEn":"On the dorsum of the foot, between the 4th and 5th toes, proximal to the web margin of the toes at the border of the red and white flesh.","actsEn":"Headache, tinnitus, deafness, red, swollen and painful eyes.","specEn":"Ying-Spring point (Water)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：足背中间皮神经（L4~S1）；血管：足背动静脉分支。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.3-0.5 cun. Moxibustion is applicable.","noteEn":""},"GB44":{"en":"Foot Orifice Yin","locEn":"On the toe, the 4th toe on the lateral side of the distal phalanx, 0.1 cun posterior-lateral to the corner of the toenail root.","actsEn":"Headache, red, swollen and painful eyes, tinnitus, deafness, sore and swollen throat, insomnia.","specEn":"Jing-Well point (Metal)","anat":"皮肤→皮下组织→趾骨骨膜。神经血管：足背中间皮神经（L4~S1）；血管：足背动静脉分支。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx. ","opEn":"Insert superficially 0.1 cun. Moxibustion is applicable.","noteEn":""},"SP1":{"en":"Hidden White","locEn":"On the toe, the great toe on the medial side of the distal phalanx, 0.1 cun posterior-lateral to the corner of the toenail root.","actsEn":"Uterine bleeding, blood in the stool, abdominal distension, manic-depressive psychosis, excessive dreaming.","specEn":"Jing-Well point (Wood)","anat":"皮肤→皮下组织→趾骨骨膜。神经血管：隐神经、足底内侧神经（L4~S1）；血管：足背动脉网。","anatEn":"Skin → subcutaneous tissue → periosteum of the phalanx. ","opEn":"Insert superficially 0.1 cun. Moxibustion is applicable.","noteEn":"Moxibustion on Yinbai to stop uterine bleeding is an empirical usage."},"SP3":{"en":"Supreme White","locEn":"In the metatarsal region, proximal to the 1st metatarsophalangeal joint at the border of the red and white flesh in the depression.","actsEn":"Stomachache, abdominal distension, borborygmus, diarrhea, constipation, beriberi.","specEn":"Shu-Stream point; Yuan-Source point","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：隐神经、足底内侧神经（L4~S1）；血管：足背动脉网。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.5-0.8 cun. Moxibustion is applicable.","noteEn":""},"SP4":{"en":"Grandfather Grandson","locEn":"In the metatarsal region, on the lower border in front of the base of the 1st metatarsal bone at the border of the red and white flesh.","actsEn":"Stomachache, vomiting, abdominal pain, abdominal distension, diarrhea, dysentery, vexation.","specEn":"Luo-Connecting point; Confluent point (opening to the Chong Vessel)","anat":"皮肤→皮下组织→足背/足底肌腱与骨面。神经血管：隐神经、足底内侧神经（L4~S1）；血管：足背动脉网。","anatEn":"Skin → subcutaneous tissue → tendons and bone surfaces of the foot. ","opEn":"Insert perpendicularly 0.6-1.2 cun. Moxibustion is applicable.","noteEn":"Combined with Neiguan (PC6) for disorders of the stomach, heart and chest."},"SP6":{"en":"Three Yin Intersection","locEn":"On the medial side of the lower leg, 3 cun above the tip of the medial malleolus, on the posterior border of the medial aspect of the tibia.","actsEn":"Irregular menstruation, dysmenorrhea, amenorrhea, leukorrhea, infertility, nocturnal emission, impotence, enuresis, insomnia, weakness and paralysis of the lower limbs.","specEn":"The three foot Yin Meridians crossing (meeting) point","anat":"皮肤→皮下组织→比目鱼肌与趾长屈肌之间→胫骨后肌。浅层有隐神经分支、大隐静脉；深层为胫神经与胫后动静脉。孕妇禁深刺。","anatEn":"Skin → subcutaneous tissue → between soleus and flexor digitorum longus → tibialis posterior. Superficially branches of the saphenous nerve and great saphenous vein; deeply the tibial nerve and posterior tibial vessels. Deep needling contraindicated in pregnancy.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Needling is contraindicated in pregnancy (Hegu and Sanyinjiao are forbidden points during pregnancy)."},"SP8":{"en":"Earth Pivot","locEn":"On the medial side of the lower leg, 3 cun below SP9 (Yinlingquan), on the posterior border of the medial aspect of the tibia.","actsEn":"Dysmenorrhea, irregular menstruation, abdominal pain, diarrhea, edema, difficult urination.","specEn":"Xi-Cleft point","anat":"皮肤→皮下组织→小腿肌群。神经血管：隐神经（L3~L4）、胫神经；血管：大隐静脉、胫后动静脉。","anatEn":"Skin → subcutaneous tissue → crural muscle groups. ","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"Pressing and kneading work well for acute dysmenorrhea."},"SP9":{"en":"Yin Mound Spring","locEn":"On the medial side of the lower leg, in the depression between the lower border of the medial condyle and the medial border of the tibia.","actsEn":"Abdominal distension, diarrhea, edema, difficult urination, jaundice, knee pain, leukorrhea.","specEn":"He-Sea point (Water)","anat":"皮肤→皮下组织→鹅足腱（缝匠肌、股薄肌、半腱肌联合腱）下方→腓肠肌内侧头。浅层有大隐静脉与隐神经；深层为胫后动静脉。","anatEn":"Skin → subcutaneous tissue → below the pes anserinus (conjoint tendon of sartorius, gracilis, semitendinosus) → medial head of gastrocnemius. Superficially the great saphenous vein and saphenous nerve; deeply the posterior tibial vessels.","opEn":"Insert perpendicularly 1-2 cun. Moxibustion is applicable.","noteEn":"A key point for promoting urination and resolving dampness."},"SP10":{"en":"Sea of Blood","locEn":"In the anterior femoral region, 2 cun above the medial end of the base of the patella, on the prominence of m. vastus medialis.","actsEn":"Irregular menstruation, dysmenorrhea, amenorrhea, uterine bleeding, urticarial wheals, eczema, erysipelas, knee pain.","specEn":"Foot Taiyin Jing-River point (non-special point); key point for blood disorders","anat":"皮肤→皮下组织→股内侧肌。浅层有股神经前皮支、大隐静脉属支；深层为股动静脉肌支。","anatEn":"Skin → subcutaneous tissue → vastus medialis. Superficially the anterior cutaneous branches of the femoral nerve and tributaries of the great saphenous vein; deeply muscular branches of the femoral vessels.","opEn":"Insert perpendicularly 1-1.5 cun. Moxibustion is applicable.","noteEn":"\"To treat wind, first treat the blood\"; commonly used for skin diseases."},"SP15":{"en":"Great Horizontal","locEn":"On the abdomen, 4 cun lateral to the umbilicus.","actsEn":"Abdominal pain, abdominal distension, diarrhea, constipation.","specEn":"Foot Taiyin, the Yin Linking Vessel (Yinwei) crossing (meeting) point","anat":"皮肤→皮下组织→腹直肌鞘与腹直肌（或腹外斜肌、腹内斜肌、腹横肌）→腹横筋膜→腹膜。神经血管：胸神经前支（T6~L1）；血管：腹壁动静脉、腹壁浅静脉。","anatEn":"Skin → subcutaneous tissue → rectus sheath and rectus abdominis (or obliquus externus/internus/transversus abdominis) → transversalis fascia → peritoneum. ","opEn":"Insert perpendicularly 1-2 cun. Moxibustion is applicable.","noteEn":""},"SP21":{"en":"Great Embrace","locEn":"In the lateral thoracic region, the 6th intercostal space, on the mid-axillary line.","actsEn":"Chest and hypochondriac pain, wheezing and dyspnea.","specEn":"Great Luo point of the spleen","anat":"皮肤→皮下组织→腹外斜肌→腹内斜肌→腹横肌。神经血管：胸神经前支（T6~L1）；血管：腹壁动静脉、腹壁浅静脉。","anatEn":"Skin → subcutaneous tissue → obliquus externus → obliquus internus → tran
