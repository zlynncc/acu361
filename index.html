        <p>按科别分级 · ${RX_TOTAL} 张常用处方 · 主穴 / 加减 / 方义 · 中英对照<br><span style="font-size:10px;font-style:italic;font-family:Georgia,serif">By category · ${RX_TOTAL} prescriptions · principal points, modifications &amp; rationale · bilingual</span></p>
      </section>
      ${RX.map(c => `
        <div class="card subj-row" data-rxcat="${c.cat}" style="padding:14px 15px;border-radius:16px">
          <span class="subj-icon" style="width:38px;height:38px;font-size:17px">${c.icon}</span>
          <div class="subj-text">
            <div class="subj-name" style="font-size:16px;font-family:'Palatino','Palatino Linotype','Songti SC','STSong','Noto Serif SC',Georgia,serif">${c.cat}<span class="subj-en">${c.en}</span></div>
            <div class="subj-desc">${c.items.map(x => x.t).join(' · ')}</div>
          </div>
          <div class="subj-count">${c.items.length} 方 · RX</div>
          <span class="chev">${ICON.chev}</span>
        </div>`).join('')}
      <div style="margin:18px 2px 8px;font-size:10.5px;line-height:1.9;color:var(--ink3);letter-spacing:.02em">
        处方按《针灸学》规划教材及《针灸处方学》常用方整理，仅供学习参考；临床应用须辨证加减，急重症及时就医。<br><span style="font-style:italic;font-family:Georgia,serif">Compiled from standard acupuncture textbooks for study reference; modify by pattern differentiation, and seek urgent care for acute conditions.</span>
      </div>
      <div style="height:8px"></div>`;
    view.scrollTop = 0;
  }

  function viewRxList(cat) {
    const c = rxCatBy[cat];
    setTopbar({ title: c.cat + ' · 配穴', titleEn: c.en, sub: c.items.length + ' 方', back: 'rx' });
    setTab('rx');
    view.innerHTML = `
      <section class="hero" style="padding-bottom:4px">
        <div class="kicker">${c.en}</div>
        <h2 class="serif" style="font-size:24px">${c.cat}</h2>
        <p>${c.items.length} 张常用处方 · 点击查看主穴与方义<br><span style="font-size:10px;font-style:italic;font-family:Georgia,serif">Tap any prescription for its principal points and rationale</span></p>
      </section>
      <div class="card subj-list" style="border-radius:16px;overflow:hidden">
        ${c.items.map((x, i) => `
          <div class="subj-row" data-rxitem="${c.cat}" data-rxidx="${i}">
            <span class="subj-icon">${c.icon}</span>
            <div class="subj-text">
              <div class="subj-name" style="font-family:'Palatino','Palatino Linotype','Songti SC','STSong','Noto Serif SC',Georgia,serif">${x.t}<span class="subj-en">${x.en}</span></div>
              <div class="subj-desc">主穴 Principal：${x.p.map(pt => pt[0]).join('、')}</div>
            </div>
            <span class="chev">${ICON.chev}</span>
          </div>`).join('')}
      </div>
      <div style="height:10px"></div>`;
    view.scrollTop = 0;
  }

  function viewRxDetail(cat, i) {
    const c = rxCatBy[cat];
    const x = c.items[i];
    if (!x) { viewRxList(cat); return; }
    setTopbar({ title: x.t, titleEn: c.cat, sub: c.items.length + ' 方', back: 'rx/' + encodeURIComponent(c.cat) });
    setTab('rx');
    view.innerHTML = `
      <section class="hero" style="padding-bottom:4px">
        <div class="kicker">${c.en}</div>
        <h2 class="serif" style="font-size:24px">${x.t}</h2>
        <p>${x.en}</p>
      </section>

      <div class="card" style="padding:16px 15px 8px">
        <div class="k" style="font-size:10.5px;letter-spacing:.22em;color:var(--gold)">主穴 · PRINCIPAL POINTS</div>
        <div style="margin-top:8px">
          ${x.p.map(pt => {
            const p = byCode[pt[1]];
            const enP = p ? ((window.AC_EN.P[p.c] || {}).en) || '' : '';
            const enLoc = p ? ((window.AC_EN.P[p.c] || {}).locEn || '').slice(0, 80) : '';
            const inner = `<div class="code-badge">${pt[1] || pt[0]}</div>
              <div class="prow-text">
                <div class="pname">${pt[0]}</div>
                ${p ? `<div class="ploc">${p.loc.replace(/^在[^，]*，/, '')}</div>` : ''}
                ${p ? `<div style="font-size:10px;color:var(--ink3);font-style:italic;font-family:Georgia,'Palatino',serif;margin-top:1px">${enP}${enLoc ? ' — ' + enLoc : ''}</div>` : ''}
              </div>`;
            return p
              ? `<div class="point-row" data-go="point/${pt[1]}">${inner}<span class="chev">${ICON.chev}</span></div>`
              : `<div class="point-row" style="cursor:default">${inner}</div>`;
          }).join('')}
        </div>
      </div>

      ${x.add ? `<div class="card" style="padding:14px 15px">
        <div class="k" style="font-size:10.5px;letter-spacing:.22em;color:var(--gold)">随证加减 · MODIFICATIONS</div>
        <div style="margin-top:7px;font-size:12.5px;line-height:1.95;color:var(--ink2)">${x.add}</div>
        ${x.addEn ? `<div style="margin-top:5px;font-size:11px;line-height:1.8;color:var(--ink3);font-style:italic;font-family:Georgia,'Palatino',serif">${x.addEn}</div>` : ''}
      </div>` : ''}

      <div class="card" style="padding:14px 15px">
        <div class="k" style="font-size:10.5px;letter-spacing:.22em;color:var(--gold)">方义 · RATIONALE</div>
        <div style="margin-top:7px;font-size:12.5px;line-height:1.95;color:var(--ink2)">${x.why}</div>
        <div style="margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);font-size:11px;line-height:1.8;color:var(--ink3);font-style:italic;font-family:Georgia,'Palatino',serif">${x.e}</div>
      </div>

      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn" data-rxcat="${c.cat}" style="cursor:pointer">返回${c.cat}列表</button>
      </div>
      <div style="height:12px"></div>`;
    view.scrollTop = 0;
  }

  /* ---------------- 路由 ---------------- */
  function parseHash() {
    const h = (location.hash || '#/home').replace(/^#\/?/, '');
    const parts = h.split('/');
    return {
      page: parts[0] || 'home',
      arg: parts[1] ? decodeURIComponent(parts[1]) : '',
      arg2: parts[2] ? decodeURIComponent(parts[2]) : ''
    };
  }

  function render() {
    const { page, arg, arg2 } = parseHash();
    switch (page) {
      case 'mer': viewMer(arg); break;
      case 'point': viewPoint(arg); break;
      case 'search': viewSearch(); break;
      case 'rx': viewRx(arg, arg2); break;
      case 'tech': viewTech(arg, arg2); break;
      case 'quiz':
        if (arg && /^(merbank|angles|rxbank|tchbank:)/.test(arg)) {
          quizState = null;
          viewQuizCat(arg);
        } else if (arg) {
          if (arg === 'wrong' && wrongCount() === 0) {
            quizState = null;
            location.hash = '#/quiz';
            break;
          }
          if (!quizState || quizState.sub !== arg || quizState.finished || !quizState.items) quizState = newQuiz(arg, QUIZ_SIZE);
          viewQuiz();
        } else {
          quizState = null;
          viewQuiz();
        }
        break;
      case 'me': viewMe(); break;
      case 'theory': viewTheory(); break;
      case 'spec':
        if (arg) viewSpecGroup(arg); else viewSpec();
        break;
      default: viewHome();
    }
  }

  /* ---------------- 事件 ---------------- */
  /* 事件委托绑在 .app 上：顶部返回键、底部导航都在 #view 之外 */
  const appRoot = $('.app') || view;
  appRoot.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) {
      const to = go.dataset.go;
      /* 返回键 / 底部导航都会退出当前答题会话，避免回到旧题目 */
      if (go.dataset.back === '1' || go.classList.contains('tab')) quizState = null;
      if (location.hash === '#/' + to) render(); else location.hash = '#/' + to;
      return;
    }

    const side = e.target.closest('[data-side]');
    if (side) return; // 由局部监听处理

    const opt = e.target.closest('[data-opt]');
    if (opt && quizState && !quizState.finished && quizState.picked === null) {
      const it = quizState.items[quizState.i];
      const picked = it.options[Number(opt.dataset.opt)];
      quizState.picked = picked;
      if (picked === it.answer) quizState.right++;
      answered++;
      recordWrong(it, picked === it.answer);
      viewQuiz();
      return;
    }

    const tc = e.target.closest('[data-techcat]');
    if (tc) { location.hash = '#/tech/' + encodeURIComponent(tc.dataset.techcat); return; }

    const ti = e.target.closest('[data-techitem]');
    if (ti) { location.hash = '#/tech/' + encodeURIComponent(ti.dataset.techitem) + '/' + ti.dataset.techidx; return; }

    const rxc = e.target.closest('[data-rxcat]');
    if (rxc) { location.hash = '#/rx/' + encodeURIComponent(rxc.dataset.rxcat); return; }

    const rxi = e.target.closest('[data-rxitem]');
    if (rxi) { location.hash = '#/rx/' + encodeURIComponent(rxi.dataset.rxitem) + '/' + rxi.dataset.rxidx; return; }

    const sub = e.target.closest('[data-sub]');
    if (sub) { location.hash = '#/quiz/' + sub.dataset.sub; return; }

    const me = e.target.closest('[data-me]');
    if (me) { meTab = me.dataset.me; viewMe(); return; }

    const th = e.target.closest('[data-theme]');
    if (th) { setTheme(th.dataset.theme); viewMe(); return; }

    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'next') {
        if (quizState.i === quizState.items.length - 1) {
          quizState.finished = true;
        } else {
          quizState.i++; quizState.picked = null;
        }
        viewQuiz();
      } else if (a === 'again') {
        const sub = (quizState && quizState.sub) || 'PC';
        quizState = newQuiz(sub, QUIZ_SIZE);
        viewQuiz();
      } else if (a === 'quizhome') {
        quizState = null;
        location.hash = '#/quiz';
      } else if (a === 'reset') {
        if (confirm('确定清空所有学习记录与收藏？')) {
          learned.clear(); fav.clear(); persist();
          viewMe();
        }
      } else if (a === 'share') {
        doShare();
      } else if (a === 'wa') {
        window.open('https://wa.me/?text=' + encodeURIComponent(SHARE_TITLE + '\n' + SHARE_TEXT + '\n' + SHARE_URL), '_blank');
      } else if (a === 'export') {
        const favList = [...fav].map(c => byCode[c]).filter(Boolean);
        const learnList = [...learned].map(c => byCode[c]).filter(Boolean);
        const wrongList = Object.values(wrongBook).sort((x, y) => (y.wrong || 0) - (x.wrong || 0));
        let txt = '腧穴 361 · 学习记录导出\nExported: ' + new Date().toLocaleString() + '\n\n';
        txt += '== 概览 ==\n已掌握 ' + learnList.length + ' · 收藏 ' + favList.length + ' · 做题 ' + answered + ' · 错题 ' + wrongList.length + '\n\n';
        txt += '== 已掌握 Learned (' + learnList.length + ') ==\n' + (learnList.map(p => p.c + ' ' + p.n).join('\n') || '无') + '\n\n';
        txt += '== 收藏 Favorites (' + favList.length + ') ==\n' + (favList.map(p => p.c + ' ' + p.n).join('\n') || '无') + '\n\n';
        txt += '== 错题 Wrong (' + wrongList.length + ') ==\n' + (wrongList.map(r => '[' + (r.wrong || 1) + ' 次] ' + (r.item ? (r.item.type + ' — ' + (r.item.answer || '').replace(/^.*（/, '').replace(/）$/, '')) : (r.q || ''))).join('\n') || '无') + '\n';
        try {
          const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
          const a2 = document.createElement('a');
          a2.href = URL.createObjectURL(blob);
          a2.download = 'acu361-records-' + new Date().toISOString().slice(0, 10) + '.txt';
          document.body.appendChild(a2);
          a2.click();
          a2.remove();
          toast('记录已导出 · Records exported');
        } catch (e2) {
          toast('导出失败，请截图保存');
        }
      } else if (a === 'copy') {
        copyLink();
      } else if (a === 'learn' || a === 'fav') {
        const { arg } = parseHash();
        const p = byCode[arg];
        if (!p) return;
        if (a === 'learn') { learned.has(p.c) ? learned.delete(p.c) : learned.add(p.c); }
        else { fav.has(p.c) ? fav.delete(p.c) : fav.add(p.c); }
        persist();
        viewPoint(p.c);
      }
      return;
    }
  });

  view.addEventListener('scroll', () => {
    topbar.classList.toggle('scrolled', view.scrollTop > 4);
    checkA2HS();
  }, { passive: true });

  /* ---------------- 添加到主屏幕引导 ---------------- */
  const A2HS_KEY = 'acu361.a2hs';       /* 记录：later=7 天后再问 / done=不再问 */
  const IS_STANDALONE = window.matchMedia('(display-mode: standalone)').matches ||
                        window.navigator.standalone === true;
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const A2HS_SCROLL_TRIGGER = 260;      /* 首页滑过约 260px 时才出现，不打扰首屏 */
  let a2hsShown = false;
  let deferredPrompt = null;

  function a2hsState() {
    try { return localStorage.getItem(A2HS_KEY) || ''; } catch (e) { return ''; }
  }
  function a2hsSet(v) {
    try { localStorage.setItem(A2HS_KEY, v); } catch (e) {}
  }

  function showA2HS() {
    if (a2hsShown || IS_STANDALONE) return;
    if (a2hsState() === 'done') return;
    const later = Number(a2hsState().split(':')[1] || 0);
    if (a2hsState().startsWith('later') && Date.now() < later) return;
    a2hsShown = true;
    document.getElementById('a2hsBar').classList.add('on');
  }
  function hideA2HS() {
    document.getElementById('a2hsBar').classList.remove('on');
  }

  /* 只在首页（未进入具体穴位/章节）且滑过阈值时提示 */
  function checkA2HS() {
    if (a2hsShown) return;
    const h = location.hash.replace(/^#\/?/, '').split('/')[0] || 'home';
    if (h !== 'home') return;
    /* 答题中不弹（会挡住底部「下一题」按钮） */
    const onQuiz = document.querySelector('.quiz-top') || document.querySelector('.quiz-foot');
    if (onQuiz) return;
    if (view.scrollTop > A2HS_SCROLL_TRIGGER) showA2HS();
  }

  function a2hsSheetHTML() {
    const ios = IS_IOS;
    const steps = ios ? [
      ['点底部中间的 <b>分享按钮</b>（方框带向上箭头）', 'Tap the Share button in Safari’s toolbar'],
      ['在菜单里向下滑，选 <b>添加到主屏幕</b>', 'Scroll down and choose “Add to Home Screen”'],
      ['右上角点 <b>添加</b>，桌面就会出现「腧穴 361」', 'Tap “Add” — the app icon appears on your Home Screen']
    ] : [
      ['点右上角 <b>⋮ 菜单</b>', 'Tap the ⋮ menu in Chrome'],
      ['选 <b>添加到主屏幕 / 安装应用</b>', 'Choose “Add to Home screen” or “Install app”'],
      ['点 <b>安装</b>，桌面就会出现「腧穴 361」', 'Tap “Install” — the app icon appears on your Home Screen']
    ];
    return `
      <h3>添加到手机主屏幕</h3>
      <div class="sub">ADD TO HOME SCREEN · ${ios ? 'iOS / Safari' : 'ANDROID / Chrome'}</div>
      ${steps.map((s, i) => `
        <div class="a2hs-step">
          <div class="a2hs-num">${i + 1}</div>
          <div class="tx">${s[0]}<span class="en">${s[1]}</span></div>
        </div>`).join('')}
      <div style="margin-top:16px;padding:10px 12px;background:var(--paper);border-radius:10px;font-size:11px;line-height:1.75;color:var(--ink2)">
        完成后，手机桌面上会出现「腧穴 361」图标，以后从图标打开，就像正常 App 一样，没有地址栏，也能双指放大。
      </div>
      <button class="close" id="a2hsClose">知道了 · Got it</button>
    `;
  }

  function openA2HSSheet() {
    const mask = document.getElementById('a2hsMask');
    document.getElementById('a2hsSheet').innerHTML = a2hsSheetHTML();
    mask.classList.add('on');
    document.getElementById('a2hsClose').onclick = () => {
      mask.classList.remove('on');
      hideA2HS();
      a2hsSet('done');
    };
  }

  document.getElementById('a2hsHow').addEventListener('click', async () => {
    /* Android/Chrome 支持原生安装，直接调起；否则显示图文步骤 */
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const r = await deferredPrompt.userChoice;
      deferredPrompt = null;
      if (r && r.outcome === 'accepted') { a2hsSet('done'); hideA2HS(); }
      return;
    }
    openA2HSSheet();
  });

  document.getElementById('a2hsLater').addEventListener('click', () => {
    hideA2HS();
    a2hsSet('later:' + (Date.now() + 7 * 24 * 3600 * 1000));
  });

  document.getElementById('a2hsMask').addEventListener('click', e => {
    if (e.target.id === 'a2hsMask') e.currentTarget.classList.remove('on');
  });

  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
  });

  window.addEventListener('appinstalled', () => {
    a2hsSet('done');
    hideA2HS();
  });

  /* 首屏若内容不足一屏（大屏），滚动事件不会触发：进来 3 秒后补一次判断 */
  setTimeout(() => { if (view.scrollHeight <= view.clientHeight + 40) checkA2HS(); }, 3000);

  window.addEventListener('hashchange', () => { mapSide = 'f'; render(); });
  /* 外部脚本延迟到页面就绪后再插入时，数据可能晚到：重新渲染一次 */
  window.addEventListener('load', () => setTimeout(render, 0));

  applyTheme();
  render();
  setTab('home');

  /* ---------------- 离线可用（Service Worker） ---------------- */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }
})();

</script>
</body>
</html>
